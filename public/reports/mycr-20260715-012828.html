.card[data-status="skipped"] .card-head { border-left-color: var(--info); }
.card[data-status="blocked"] .card-head { border-left-color: var(--bad); }
.card.priority-critical .card-head {
  background: linear-gradient(180deg, #fff7f8, #fff);
}
.card.priority-focus .card-head {
  background: linear-gradient(180deg, #fffbeb, #fff);
}
.card.priority-follow .card-head {
  background: linear-gradient(180deg, #eff6ff, #fff);
}
.card-title {
  font-size: 16px;
  line-height: 1.42;
}
.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 7px;
}
.badge {
  gap: 7px;
  min-width: 0;
  padding: 6px 11px;
  text-transform: none;
  white-space: nowrap;
}
.card-summary {
  color: #526173;
  margin-top: 9px;
}
.badge::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.card-body {
  background: #fff;
  padding: 0 18px 18px;
}
.grid {
  grid-template-columns: 1fr;
  gap: 10px;
}
.field {
  background: #fbfcfe;
  border-color: #e6ecf3;
  padding: 13px 14px;
}
.field strong {
  color: #536175;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: uppercase;
}
.field-body {
  color: #1f2937;
  line-height: 1.62;
}
.comment {
  background: #fff8ed;
  border-left-color: var(--accent-2);
  color: #1f2937;
}
.comment-head {
  color: #1f2937;
}
.pr-readout {
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}
.story-block {
  border-top-color: #e2e8f0;
}
.story-block.hero-block {
  background: linear-gradient(180deg, #fbfffe, #f7fbfa);
  border-color: #d5e7e4;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
}
.story-block h4,
.review-rail h4,
.comments-panel h4 {
  font-size: 13px;
  font-weight: 900;
}
.story-line {
  grid-template-columns: 116px minmax(0, 1fr);
  border-top-color: #e9eef5;
}
.story-label {
  color: #607086;
}
.review-rail {
  border: 1px solid #e3eaf2;
  border-radius: 8px;
  padding: 14px;
  background: #fbfcfe;
}
.review-rail .fact-list {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.fact {
  border-top-color: #e8eef5;
}
.comments-panel {
  border-top-color: #e2e8f0;
}
.comment-list {
  gap: 12px;
}
.skip-group {
  box-shadow: var(--shadow);
}
.skip-group-head {
  align-items: center;
  background: linear-gradient(180deg, #fff, #fbfcfe);
}
.skip-row {
  grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.85fr);
}
.blocker-item {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
}
.empty {
  background: #fff;
  box-shadow: var(--shadow);
}
@media (max-width: 840px) {
  .topbar, .card-head { grid-template-columns: 1fr; display: grid; }
  .card-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .dashboard, .grid, .metrics { grid-template-columns: 1fr; }
  .guide-grid { grid-template-columns: 1fr; }
  .headline-row { align-items: flex-start; flex-direction: column; }
  .pr-readout { grid-template-columns: 1fr; }
  .review-rail { position: static; }
  .story-line { grid-template-columns: 1fr; gap: 4px; }
  .timeline-item { grid-template-columns: 1fr; }
  .controls { position: static; }
  .utilities { width: 100%; margin-left: 0; }
  .utility-button { flex: 1 1 auto; }
  .skip-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1 data-i18n="title">MyCR 审核报告</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="toggle" aria-label="Language">
      <button type="button" data-lang-button="zh" class="active">中文</button>
      <button type="button" data-lang-button="en">EN</button>
    </div>
  </div>
  <section class="metrics" id="metrics"></section>
  <section class="dashboard">
    <div class="panel">
      <h2 data-i18n="statusDistribution">状态分布</h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="timeline">执行时间线</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
  <section class="panel" id="overviewPanel" style="display: none; margin-top: 16px;">
    <h2 data-i18n="overviewSection">整体摘要</h2>
    <div class="overview-content" id="overviewContent"></div>
  </section>
  <section class="panel reading-guide" id="readingGuidePanel" style="display: none;">
    <div class="guide-head">
      <h2 data-i18n="readingGuide">阅读建议</h2>
      <span data-i18n="readingGuideHint">先看高风险和高影响 PR</span>
    </div>
    <div class="guide-grid" id="readingGuide"></div>
  </section>
  <section class="controls">
    <input class="search" id="search" type="search">
    <div class="chips" id="chips"></div>
    <div class="utilities">
      <button type="button" class="utility-button" id="openAll"></button>
      <button type="button" class="utility-button" id="closeAll"></button>
    </div>
  </section>
  <section class="section-heading">
    <h2 data-i18n="reviewedSection">已处理 PR</h2>
    <div class="hint" data-i18n="reviewedHint">点击卡片查看细节</div>
  </section>
  <main class="cards" id="cards"></main>
  <section class="section-heading" id="skippedHeading">
    <h2 data-i18n="skippedGroups">未审核 PR 分类</h2>
    <div class="hint" data-i18n="skippedHint">按排除原因分组</div>
  </section>
  <section class="skip-groups" id="skipGroups"></section>
  <section class="section-heading" id="followUpHeading">
    <h2 data-i18n="followUpSection">后续关注</h2>
    <div class="hint" data-i18n="followUpHint">接近可处理但仍有阻塞</div>
  </section>
  <section class="cards" id="followUpCards"></section>
  <section class="panel" id="evolutionPanel" style="display: none; margin-top: 18px;">
    <h2 data-i18n="selfEvolutionSection">自进化记录</h2>
    <div class="evolution-list" id="evolutionList"></div>
  </section>
  <div class="footer" id="footer"></div>
</div>
<script>
const reportData = {"approved":[],"blocked":[],"commented":[{"alternative_designs":"一种方案是在 runner.Run 中当 ro.Messages 非空时序列化完整 history；另一种方案是在 llmflow 构造最终 model request 后回填 trace input。前者改动小，后者最准确但会跨越更多模块。","api_surface":"没有新增公开 Go API；用户可见变化是 runner completion event 的 ExecutionTrace.Input/Output 更完整，文档增加 execution trace 描述。","approach":"PR 在 runner.Run 中构造 executionTraceInput，并把它传入 processAgentEvents/eventLoopContext，最终在 emitRunnerCompletion 中写入 runnerCompletionEvent.ExecutionTrace.Input；同时调整 graph completion/fallback 选择、cloneContentParts、相关测试和文档说明。","author":"Flash-LHR","behavior_impact":"修复后，RunWithMessages 的 trace input 应能展示完整消息历史；修复前，调试者只能看到最新 user message，无法从 trace 复现真实模型输入。","blockers":[{"kind":"implementation_scope","line":551,"path":"runner/runner.go","summary":"execution trace input completeness: runner/runner.go:551","url":"https://github.com/trpc-group/trpc-agent-go/pull/2221#discussion_r3581417885","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"}],"change_inventory":"新增 runner completion trace input/output，调整 graph completion fallback 的 payload 判断，克隆 ContentRef，补充 execution trace 测试和 graph/llmflow 相关测试。","ci_state":"当前候选摘要显示 required checks 无非绿项；本轮仍因行内问题未审批。","cross_module_impact":"trace 捕获、graph completion、llmflow 请求构造和外部调试工具都会依赖这些快照来解释一次运行。","design_assessment":"整体设计方向可接受，但当前 RunWithMessages 漏历史会让 trace 在重要路径上失真，属于合入前应修复的问题。","evidence_checked":"阅读了 PR diff 中 runner.Run、RunWithMessages 测试、execution_trace_test、graph trace 相关改动，并确认当前 head=13740bef7fe0235aeab12d739a3bca2232d625a3；关键证据是 RunWithMessages 测试明确把完整 history 放在 RunOptions.Messages，而 runner.Run 新增的 snapshot 只序列化 message 参数。","head_sha":"13740bef7fe0235aeab12d739a3bca2232d625a3","implementation_derivation":"把 trace 构建放在 runner completion 事件附近是合理范围，因为 completion 事件知道最终 status、state delta 和 output 选择；但 input 快照必须来自同一个已经规范化的 RunOptions，才能和 llmflow 实际消费的消息保持一致。","inline_comments":[{"body":"This snapshots only the latest `message` argument, but `RunWithMessages` carries the caller-supplied history in `ro.Messages`. With execution tracing enabled, the run-level input omits the prior system/assistant/tool/user turns that actually seed the request, so the trace is not reproducible; please snapshot `ro.Messages` when present, or include both the expanded history and latest message, and add a `RunWithMessages` trace regression test.\n\n<details><summary>中文<\/summary>\n\n这里现在只记录最新的 `message` 参数，但 `RunWithMessages` 会把调用方传入的完整历史放在 `ro.Messages` 里。开启 execution trace 后，run 级别的输入会丢掉真正参与请求的历史上下文，导致 trace 不能复现；建议在 `ro.Messages` 存在时记录完整历史，或同时记录完整历史和最新消息，并补一个 `RunWithMessages` 的 trace 回归测试。\n\n<\/details>","focus":"execution trace input completeness","line":551,"path":"runner/runner.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2221#discussion_r3581417885"}],"issue_evidence_gaps":"缺少一个覆盖 RunWithMessages 带 system/assistant/tool 历史且开启 execution trace 的回归测试。","merge_policy":{"mode":"blocked_by_review_findings","reason":"当前 head 有新投递的 trace correctness 评论，需作者修复后重新复核。"},"module_impact":"直接影响 runner 和 trace 消费者；间接影响用 RunWithMessages 做无状态会话、评测回放、服务端代理或自定义 session 管理的调用方。","modules":"主要涉及 runner/runner.go、runner/execution_trace_test.go、agent/trace、internal/tracecapture、graph executor 以及 llmflow 流程。","necessity_assessment":"需求本身成立：trace 如果缺少输入输出快照，排查 graph/runner 行为时需要回溯多个结构。但本轮发现 RunWithMessages 路径的输入快照不完整，导致该能力在一个重要调用方式下不能复现真实请求。","number":2221,"outcome":"提交 1 条 inline comment，要求 RunWithMessages 路径记录完整输入历史；未提交 approval、LGTM 或 merge。","problem":"PR 试图让 graph node visit、runner event loop、final response fallback 和 execution trace 更一致，特别是把 runner completion 的输入输出快照写入事件，方便维护者从 trace 中理解一次运行的入口消息、图执行结果和最终输出。","problem_framing":"PR 关注 trace 和 runner 结果的一致性，但输入侧的根因是 runner 有两套输入来源：latest message 表示本轮触发消息，RunOptions.Messages 表示完整历史。trace 如果只绑定前者，就把外部历史调用模型的语义简化成单条消息。","reproduction_on_base":"这是 PR 新增 trace 行为，base 分支没有同等输入快照；本轮通过代码路径对照验证问题，而不是运行端到端 trace。","review_action":"Posted one inline GitHub review comment; no approval, request-changes review, LGTM, or merge was submitted.","risk":"如果直接合入，execution trace 会在无状态历史调用场景下给出误导性输入快照，后续定位 prompt/history 问题时可能判断错误。","root_cause":"runner.Run 在应用 RunOptions 后立即调用 executionTraceMessageSnapshot(message)，没有检查 ro.Messages 是否存在，因此忽略 RunWithMessages 注入的完整历史。","semantic_changes":"开启 execution trace 时，runner completion event 会包含输入和输出快照；但当前实现对 RunWithMessages 只记录最后 user message，语义上丢失调用方传入的完整历史。","solution_fit_assessment":"在 runner 层补 trace input/output 是合适控制面，因为调用者和 graph/LLM 子模块都通过 runner 事件观察运行结果；需要修正的是输入快照的数据源，不能只用 latest message。","status":"commented","technical_background":"Runner 是 trpc-agent-go 把用户输入、session、agent 执行、事件流和最终 completion 串起来的运行入口；RunWithMessages 是一种无状态或外部管理历史的调用方式，它把完整消息历史放到 RunOptions.Messages，同时把最新 user message 作为本次 invocation message 传给底层 Run。Execution trace 是调试和复现 agent 行为的审计材料，输入快照必须覆盖真正参与模型请求的上下文，否则后续排查只能看到最后一条消息。","tests_docs":"现有新增测试覆盖 graph/runner trace 输出，但缺少 RunWithMessages 带历史的 trace input 测试；建议补该路径。","title":"lsc: align steps with graph node visits","tradeoffs":"runner 层快照成本低、便于保持 completion 事件自包含，但要小心 RunWithMessages、noop session、普通 session 三种输入来源；llmflow 层快照更贴近最终请求，但会让 trace 组装分散。","url":"https://github.com/trpc-group/trpc-agent-go/pull/2221"},{"alternative_designs":"可以把 mask set 作为独立持久化状态并让 summary 带 mask generation；也可以在 delete_context 后强制失效 summary，下一轮按 visible events 重建；持久化方面可先构造 prospective state，成功后再 swap 内存 map。","api_surface":"新增 tool/context 包、delete_context/list_context/check_budget/note/read_notes 工具输入输出结构、session mask 方法和 state 字段；对 prompt processor 的事件选择语义也有用户可见影响。","approach":"PR 新增 session/context.go 管理 masked event IDs，session state 保存 mask 列表，tool/context 提供 delete/list/budget/note/read_notes 工具，content processor 改用 GetVisibleEvents，并新增 pensieve 示例展示长会话压缩流程。","author":"sks","behavior_impact":"修复后，delete_context 应对 raw events 和 summaries 都生效，并在持久化失败时保持内外状态一致；示例也应能安全消费没有模型 response 的事件。","blockers":[{"kind":"implementation_scope","line":1369,"path":"internal/flow/processor/content.go","summary":"mask-aware session summary: internal/flow/processor/content.go:1369","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418072","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":271,"path":"session/context.go","summary":"mask persistence across partial history: session/context.go:271","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418230","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":69,"path":"tool/context/context.go","summary":"delete_context persistence ordering: tool/context/context.go:69","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418391","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":168,"path":"examples/pensieve/main.go","summary":"example event-stream nil safety: examples/pensieve/main.go:168","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418540","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":172,"path":"examples/pensieve/main.go","summary":"example event-stream nil safety: examples/pensieve/main.go:172","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418718","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"}],"change_inventory":"新增 mask/unmask/visible events API、工具集合、notes 工具、budget 工具、Pensieve 示例和多组 tests；修改 content processor 从 sess.Events 改为 sess.GetVisibleEvents。","ci_state":"候选摘要显示 required checks 无非绿项，但 reviewDecision 为 CHANGES_REQUESTED 且本轮新增 5 条代码评论。","cross_module_impact":"summary builder、session services、runner event stream、tool function adapter 和用户示例都需要遵守同一 visible context 合同。","design_assessment":"整体方向有价值，但当前实现低估了 session summary 和 persistence 对可见上下文的影响，属于需要修复后再继续评审的设计正确性问题。","evidence_checked":"阅读了 PR body、session/context.go、session state/persist 相关文件、tool/context 工具实现、content processor 对 GetVisibleEvents 的接入、examples/pensieve/main.go，以及当前 head=49fa7be9466db4d7b8daf4f8cd209fbd7d6ec24c。","head_sha":"49fa7be9466db4d7b8daf4f8cd209fbd7d6ec24c","implementation_derivation":"把 visible events 封装在 session 层是合理的局部入口，因为 prompt processor 和工具都围绕 session 构建上下文；但 mask 必须成为 summary/persistence 的一等输入，否则仅替换 raw events snapshot 范围过窄。","inline_comments":[{"body":"This filters raw session events, but the summary path above still reuses stored summaries without checking whether their cutoff includes newly masked events. After `delete_context` hides an already-summarized event, its content can be injected back through the session summary; please invalidate/rebuild summaries when masks change, or make summary selection mask-aware.\n\n<details><summary>中文<\/summary>\n\n这里过滤了原始 session events，但上面的 summary 路径仍然会直接复用已存储的 summary，没有判断 summary 覆盖的内容里是否包含后来被 mask 的事件。`delete_context` 隐藏一个已经被总结过的事件后，它的内容仍可能通过 session summary 被重新注入；建议在 mask 变化时失效/重建 summary，或让 summary 选择逻辑感知 mask 状态。\n\n<\/details>","focus":"mask-aware session summary","line":1369,"path":"internal/flow/processor/content.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418072"},{"body":"This deletes mask IDs that are absent from the currently loaded `sess.Events`. If a session is loaded through a partial/windowed history, persisting that state can drop masks for older events and expose them again on a wider reload; please keep absent mask IDs unless this instance is known to contain the full authoritative event history.\n\n<details><summary>中文<\/summary>\n\n这里会删除当前 `sess.Events` 中不存在的 mask ID。如果某次 session 只加载了部分历史，持久化时就可能把更早事件的 mask 丢掉，后续更完整地加载 session 时这些事件会重新暴露；建议除非能确认当前实例包含完整权威事件历史，否则不要清理缺失的 mask ID。\n\n<\/details>","focus":"mask persistence across partial history","line":271,"path":"session/context.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418230"},{"body":"`MaskEvents` mutates the live session before `PersistMaskedEvents` succeeds. If persistence fails, this run continues with events hidden in memory but a reload restores them, so please persist a prospective mask set first or roll back the in-memory mask on error.\n\n<details><summary>中文<\/summary>\n\n`MaskEvents` 会在 `PersistMaskedEvents` 成功之前先修改当前 live session。如果持久化失败，本轮运行里事件已经被隐藏，但重新加载 session 后又会恢复，状态会前后不一致；建议先持久化待写入的 mask 集合，或在失败时回滚内存里的 mask。\n\n<\/details>","focus":"delete_context persistence ordering","line":69,"path":"tool/context/context.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418391"},{"body":"The stream can contain nil events, so reading `evt.Error` before checking `evt != nil` can panic while draining a normal runner channel. Please skip nil events before touching any event fields.\n\n<details><summary>中文<\/summary>\n\n事件流里可能出现 nil event，这里在检查 `evt != nil` 之前就读取 `evt.Error`，正常消费 runner channel 时也可能 panic。建议先跳过 nil event，再访问事件字段。\n\n<\/details>","focus":"example event-stream nil safety","line":168,"path":"examples/pensieve/main.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418540"},{"body":"Runner events are not guaranteed to carry a model `Response`, so `evt.Response.Choices` can panic on tool/control/error events. Please guard `evt.Response == nil` before reading choices.\n\n<details><summary>中文<\/summary>\n\nrunner 输出的事件不一定都有模型 `Response`，tool/control/error 等事件路径下直接访问 `evt.Response.Choices` 会 panic。建议先判断 `evt.Response == nil`，再读取 choices。\n\n<\/details>","focus":"example event-stream nil safety","line":172,"path":"examples/pensieve/main.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097#discussion_r3581418718"}],"issue_evidence_gaps":"缺少 summary 已覆盖事件后再 mask 的测试、持久化失败回滚测试、partial/windowed session mask 保留测试，以及 pensieve 示例消费 nil/response-less event 的测试。","merge_policy":{"mode":"blocked_by_review_findings","reason":"当前 head 有 session/context correctness 评论，需作者修复后重新复核。"},"module_impact":"直接影响 session、tool/context、prompt processor 和 examples；间接影响任何依赖 session summary、event replay、budget 计算或工具驱动长会话压缩的调用方。","modules":"主要影响 session/context.go、session state/persistence、internal/flow/processor/content.go、tool/context、examples/pensieve，以及围绕 session visible events 的测试。","necessity_assessment":"长会话主动压缩的需求合理，但这是新 session/tool 语义，正确性依赖 mask、summary、持久化和示例事件循环同时成立。本轮发现多个一致性和 panic 风险，暂不能批准。","number":2097,"outcome":"提交 5 条 inline comments，覆盖 summary 复注入、mask ID 清理、持久化顺序、nil event 和 nil response；未提交 approval、LGTM 或 merge。","problem":"PR 增加 Pensieve 风格的 context self-pruning 能力：模型可以 list_context、check_budget、note/read_notes，并通过 delete_context soft-hide 已处理事件，从而降低长会话上下文压力，同时保留事件用于审计。","problem_framing":"PR 解决的是上下文预算压力，但真正的边界是“模型可见上下文”不是单一 Events slice，而是原始 events、summary、notes、tool responses 和 processor 截断策略的组合。只过滤 raw events 不能保证内容真的从模型输入中消失。","reproduction_on_base":"这是新增能力，base 分支没有 delete_context 和 mask 状态；本轮通过代码路径验证 summary 复用、mask 持久化顺序和示例 stream drain 的失效路径。","review_action":"Posted five inline GitHub review comments; no approval, request-changes review, LGTM, or merge was submitted.","risk":"如果直接合入，delete_context 可能看似成功但内容仍通过 summary 回到模型输入，或持久化失败后出现当前运行和 reload 后行为不一致，示例还可能 panic。","root_cause":"mask 状态被实现成 session 内部 map，并在 GetVisibleEvents 生效；但 summary 仍按已有 cutoff 直接注入，PersistMaskedEvents 失败时没有回滚内存状态，maskedEventIDListLocked 又会删除当前 Events 中缺失的 mask ID。示例还假设每个 event 都非 nil 且有 Response。","semantic_changes":"模型可见上下文可以被工具隐藏部分 events；隐藏事件保留在 session Events 中供审计，但不应再进入后续 LLM 输入。当前 summary 和持久化失败路径会破坏这个语义。","solution_fit_assessment":"用 soft mask 而不是物理删除事件是正确控制面，能保留审计和调试；当前实现还需要把 summary invalidation、持久化原子性和工具示例健壮性补齐，才能成为可靠 API。","status":"commented","technical_background":"Session 是 agent 多轮对话、事件、状态和 summary 的持久化边界；LLM 可见上下文通常由原始 session events、summary、tool response 和 prompt processor 一起拼装。Pensieve 这类 self-pruning 机制让模型用工具主动隐藏已经处理过的上下文，因此 mask 状态必须和 session persistence、summary 复用、event stream 消费保持一致，否则“删除上下文”会在后续请求或重载时失效。","tests_docs":"PR 已补大量 session/tool/context 测试和 README，但仍缺本轮评论覆盖的 summary mask、failure rollback、partial history 和示例 nil safety 回归测试。","title":"feat(session,tool/context): Pensieve context self-pruning with example","tradeoffs":"summary 失效实现简单但可能增加下一轮 token/计算成本；mask generation 更精确但要改 summary 存储合同；回滚内存状态会增加代码复杂度，但能避免失败时内外状态分裂。","url":"https://github.com/trpc-group/trpc-agent-go/pull/2097"},{"alternative_designs":"可以把 scanner 设计为纯判定器，由各执行器负责强制超时/输出/路径；也可以做统一 middleware，在 PermissionRequest 层抽取标准执行语义。前者局部清晰，后者覆盖面更统一但需要更多适配。","api_surface":"新增 public safety package、Policy/Scanner/Report/Finding 等类型、WithSafetyScanner option、policy YAML/JSON 字段、示例 CLI 和文档页面。","approach":"PR 新增 tool/safety 包，定义 Policy、Scanner、Report、Finding、Redactor、Audit、BackendRules，并在 hostexec/workspaceexec/codeexec 中新增 WithSafetyScanner，调用前把执行请求转换成 ExecutionRequest 交给 scanner。","author":"GodBlf","behavior_impact":"修复后，foreground hostexec、Cwd 相对路径、codeexec language、output cap、path-qualified commands 和 policy typos 都应按策略被拒绝或要求人工确认；修复前这些路径可能静默通过。","blockers":[{"kind":"implementation_scope","line":13,"path":"tool/safety/backend.go","summary":"host execution default action: tool/safety/backend.go:13","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581418897","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":78,"path":"tool/safety/scanner.go","summary":"cwd-aware forbidden path matching: tool/safety/scanner.go:78","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419057","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":183,"path":"tool/safety/scanner.go","summary":"code execution language allowlist: tool/safety/scanner.go:183","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419166","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":33,"path":"tool/safety/resource.go","summary":"resource limit enforcement: tool/safety/resource.go:33","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419342","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":293,"path":"tool/safety/scanner.go","summary":"path-qualified command allowlist bypass: tool/safety/scanner.go:293","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419491","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"implementation_scope","line":35,"path":"tool/safety/config.go","summary":"strict policy parsing: tool/safety/config.go:35","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419644","verification":"已在当前 PR head 的 changed side 上投递行内评论，并回读到 GitHub discussion URL。"},{"kind":"合并冲突","summary":"GitHub refresh reports mergeable=CONFLICTING for the current head.","verification":"刷新 gh pr view 后得到 mergeable=CONFLICTING；需要作者先解决冲突。"}],"change_inventory":"新增 policy 结构、scanner 规则、resource/backend/network/path/env/dependency 检查、audit/redaction 输出、三个执行后端接入、示例和大量 tests/docs。","ci_state":"候选摘要当时没有非绿 required checks，但刷新 mergeable=CONFLICTING；代码评论和冲突均阻塞后续动作。","cross_module_impact":"hostexec/workspaceexec/codeexec、tool function optional interfaces、docs/examples 和 policy parser 必须共同维护同一个安全合同。","design_assessment":"设计方向有价值，但当前实现的安全边界存在多条可证明绕过路径，且 PR 当前有 merge conflict，必须修复后再评审。","evidence_checked":"阅读了 tool/safety 的 scanner/backend/resource/config/policy/request/path 设计、hostexec/workspaceexec/codeexec 的 WithSafetyScanner 接入 patch、examples/tool_safety_guard 示例，以及刷新后的 PR 状态；当前 head=b802126a26126bcea2a929953ba52fe30ac634b5，mergeable=CONFLICTING。","head_sha":"b802126a26126bcea2a929953ba52fe30ac634b5","implementation_derivation":"把 scanner 作为执行工具的 pre-execution gate 是正确位置，因为它能在真实进程或代码执行启动前 fail closed；但策略字段和执行器字段必须一一映射，不能停留在报告层。","inline_comments":[{"body":"For `BackendHostExec`, the policy's `HostExec.DefaultAction` is never applied to ordinary foreground commands; only TTY/background requests emit backend findings. A foreground host command that passes command/path rules can therefore run without the host-execution review gate, so please emit a backend-level finding for every hostexec request and then layer the TTY/background rules on top.\n\n<details><summary>中文<\/summary>\n\n对 `BackendHostExec` 来说，普通前台命令不会应用策略里的 `HostExec.DefaultAction`，只有 TTY/background 才会产生 backend finding。这样一个通过 command/path 规则的前台 host 命令就可能绕过 host-execution 级别的 review gate；建议每个 hostexec 请求都先产生 backend 级别判断，再叠加 TTY/background 的特殊规则。\n\n<\/details>","focus":"host execution default action","line":13,"path":"tool/safety/backend.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581418897"},{"body":"Adding `req.Cwd` to raw text only catches literal secret-like substrings; forbidden-path matching still runs on argv tokens without resolving them against the working directory. A request with `Cwd: \"/etc\"` and a relative file operand can bypass the `/etc/**` policy, so please scan normalized `Cwd` and resolve relative path arguments against it before path checks.\n\n<details><summary>中文<\/summary>\n\n把 `req.Cwd` 放进 raw text 只能捕获类似 secret 的文本片段；真正的 forbidden-path 匹配仍然只看 argv token，而且没有按工作目录解析相对路径。比如 `Cwd: \"/etc\"` 加相对文件参数就可能绕过 `/etc/**` 策略；建议扫描规范化后的 `Cwd`，并在路径检查前把相对路径按工作目录解析。\n\n<\/details>","focus":"cwd-aware forbidden path matching","line":78,"path":"tool/safety/scanner.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419057"},{"body":"`scanScript` never enforces `BackendRules.CodeExec.AllowedLanguages`; it only special-cases shell-like languages and scans the text. A codeexec backend configured by policy to allow only selected languages can still run another supported language, so please check the normalized language set against the allowlist before script scanning.\n\n<details><summary>中文<\/summary>\n\n`scanScript` 没有执行 `BackendRules.CodeExec.AllowedLanguages`，只是特殊处理 shell-like language 并扫描文本。即使策略只允许某些语言，codeexec backend 仍可能运行另一个自身支持的语言；建议在扫描脚本前先把语言集合规范化并和 allowlist 校验。\n\n<\/details>","focus":"code execution language allowlist","line":183,"path":"tool/safety/scanner.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419166"},{"body":"This only reports when the request already supplies `MaxOutputBytes` above the policy limit, but the integrated host/workspace/code execution adapters do not populate that field or truncate executor output. The documented output cap is therefore ineffective for real tool calls; please wire the policy limit into executor output handling or an after-tool truncation path.\n\n<details><summary>中文<\/summary>\n\n这里只有在请求本身已经带了超过策略限制的 `MaxOutputBytes` 时才会报告，但当前接入的 host/workspace/code execution adapter 并没有填这个字段，也没有在执行后截断输出。因此文档里的输出上限对真实工具调用不生效；建议把 policy limit 接到执行器输出处理，或统一的 after-tool 截断路径。\n\n<\/details>","focus":"resource limit enforcement","line":33,"path":"tool/safety/resource.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419342"},{"body":"`normalizeCommandName` strips directories before allowlist checks, so `/tmp/git` and `./git` are treated as the allowlisted `git`. Please reject path-qualified command names unless that exact path is explicitly allowlisted, otherwise an impostor binary can bypass `AllowedCommands`.\n\n<details><summary>中文<\/summary>\n\n`normalizeCommandName` 会在 allowlist 检查前去掉目录，所以 `/tmp/git` 和 `./git` 都会被当成允许的 `git`。建议除非策略明确允许某个完整路径，否则拒绝带路径的命令名，不然伪造的同名二进制可以绕过 `AllowedCommands`。\n\n<\/details>","focus":"path-qualified command allowlist bypass","line":293,"path":"tool/safety/scanner.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419491"},{"body":"Both JSON and YAML policy decoders accept unknown fields, which is unsafe for a security policy. A typo like `allowed_comands` or `max_output_byte` is silently ignored while the operator believes the guard is active; please use strict decoding, such as `DisallowUnknownFields` and YAML `KnownFields(true)`, with typo tests.\n\n<details><summary>中文<\/summary>\n\nJSON 和 YAML 的 policy decoder 都会接受未知字段，这对安全策略不安全。像 `allowed_comands` 或 `max_output_byte` 这样的拼写错误会被静默忽略，但使用者会以为 guard 已经生效；建议改成严格解码，例如 `DisallowUnknownFields` 和 YAML `KnownFields(true)`，并补拼写错误的测试。\n\n<\/details>","focus":"strict policy parsing","line":35,"path":"tool/safety/config.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2153#discussion_r3581419644"}],"issue_evidence_gaps":"缺少覆盖 path-qualified command、Cwd=/etc 相对路径、policy allowed languages、output cap 实际截断、unknown policy key、foreground hostexec default action 的安全回归测试。","merge_policy":{"mode":"blocked_by_review_findings_and_conflict","reason":"当前 head 有 safety boundary 评论且存在合并冲突。"},"module_impact":"直接影响所有启用 safety scanner 的执行工具；间接影响 agent tool permission 流、长运行工具、输出处理、配置发布和用户复制示例的安全预期。","modules":"主要影响 tool/safety、tool/hostexec、tool/workspaceexec、tool/codeexec、examples/tool_safety_guard、docs/mkdocs tool-safety 文档和对应 tests。","necessity_assessment":"需求成立，尤其是 host/workspace/code execution 都属于高风险执行面；但安全策略必须严格可靠。本轮发现多处绕过和失效点，当前版本不能作为安全边界合入。","number":2153,"outcome":"提交 6 条 inline comments；刷新后确认 PR 当前 mergeable=CONFLICTING；未提交 approval、LGTM 或 merge。","problem":"PR 增加工具执行安全防护：通过 safety.Scanner、policy、redaction、audit、backend rules 和各执行工具的 WithSafetyScanner 接入，对命令、路径、网络、依赖安装、后台/TTY、资源限制和脚本语言做预执行扫描。","problem_framing":"PR 要解决的是工具执行前的安全决策，但真正的根因不是“多扫描一些字符串”，而是要把策略合同落实到真实执行语义：命令解析、工作目录、语言后端、输出流、配置文件和 wrapper 接口都必须被同一策略覆盖。","reproduction_on_base":"这是新增 safety guard 能力，base 分支没有同等模块；本轮通过代码路径验证 hostexec default action、Cwd 路径、codeexec allowed languages、output cap、command allowlist 和 strict config 的失效条件。","review_action":"Posted six inline GitHub revi nning or skip-summary tool can therefore change framework behavior even when the guard allows execution; please delegate those optional interfaces when the inner tool implements them.\n\n<details><summary>中文<\/summary>\n\n这个 wrapper 保留了 `Call`/`StreamableCall`，但会丢掉 `LongRunning()`、`SkipSummarization()` 这类可选 tool interface。一个 long-running 或 skip-summary tool 被包起来后，即使 guard 允许执行，框架行为也可能被改变；建议在 inner tool 实现这些可选接口时继续透传。\n\n<\/details>","focus":"tool wrapper optional interface preservation","line":34,"path":"tool/safety/wiring.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2044#discussion_r3581419995"}],"issue_evidence_gaps":"缺少 unknown YAML key fail-fast 测试，以及 wrapper 包住 long-running/skip-summary tool 后仍保留可选接口的回归测试。","merge_policy":{"mode":"blocked_by_review_findings","reason":"当前 head 有 safety config/wiring 评论，需作者修复后重新复核。"},"module_impact":"直接影响 safety guard 接入者；间接影响 runner/tool flow 对 long-running、skip-summary、permission 和 tool 状态信息 的解释。","modules":"主要影响 tool/safety/config.go、tool/safety/wiring.go、guard/scanner/rules、README/INTEGRATION、examples/tool_safety_guard 和 tests。","necessity_assessment":"工具安全扫描方向合理，但 PR 已有多轮评论且本轮又发现 strict config 与 wrapper 透明性问题；当前版本不能批准。","number":2044,"outcome":"提交 2 条 inline comments，覆盖 strict YAML parsing 和 wrapper optional interfaces；未提交 approval、LGTM 或 merge。","problem":"PR 增加独立的 tool/safety scanner、guard、policy、parse/redact/rules 和 wiring，用来给工具执行提供结构化审计和规则扫描，并提供 README/INTEGRATION 文档和示例。","problem_framing":"PR 的问题空间不只是扫描规则是否覆盖危险字符串，还包括安全策略本身是否可信、wrapper 是否是 drop-in replacement。配置拼错或 wrapper 改变工具语义，都会让调用者对安全和运行行为产生错误预期。","reproduction_on_base":"这是新增 safety 模块，base 分支没有同等 scanner；本轮通过静态路径验证 YAML unknown fields 和 wrapper optional interface 丢失问题。","review_action":"Posted two inline GitHub review comments; no approval, request-changes review, LGTM, or merge was submitted.","risk":"如果不修复，用户可能在拼错配置时误以为策略生效，或在工具被 wrapper 包裹后丢失长运行/跳过总结语义，导致运行时行为回归。","root_cause":"LoadPolicyFile 使用 yaml.Unmarshal 覆盖默认 policy，未知字段会被 let lang = "zh";
let filter = "all";
const statusOrder = ["approved", "commented", "maintained", "merged", "skipped", "blocked"];

function text(value, fallback = "") {
  if (value === undefined || value === null || value === "") return fallback;
  if (typeof value === "object" && !Array.isArray(value)) {
    return value[lang] || value.zh || value.en || value.summary || value.body || value.mode || fallback;
  }
  return String(value);
}

function escapeHtml(value) {
  return text(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function linkifyPrReferences(html) {
  const repo = text(reportData.repo || "trpc-group/trpc-agent-go");
  if (!repo) return html;
  return html.replace(
    /(^|[^\w/])#(\d{3,6})\b/g,
    (match, prefix, number) =>
      `${prefix}<a href="https://github.com/${repo}/pull/${number}">#${number}</a>`
  );
}

function linkifyUrls(html) {
  return html.replace(
    /(https?:\/\/[^\s<>"']+)/g,
    (match) => {
      const trailing = (match.match(/[.,;)]+$/u) || [""])[0];
      const href = trailing ? match.slice(0, -trailing.length) : match;
      return `<a href="${href}">${href}</a>${trailing}`;
    }
  );
}

function formatRich(value) {
  let html = linkifyPrReferences(linkifyUrls(escapeHtml(value)));
  const replacements = [
    [
      /(P[0-2]|codecov\/patch=FAILURE|go-apidiff=FAILURE|go-apidiff|FAILURE|失败|阻塞|不能合入|不能 merge|未合并|破坏性|breaking|unbounded|无界|绕过|丢失|重复|不稳定|风险)/gi,
      "mark-bad"
    ],
    [
      /(LGTM|已合并|已批准|squash merge|merged|approved|CI 全绿|全绿|修复有效|\bresolved\b|\bresolve\b)/gi,
      "mark-good"
    ],
    [
      /(pending|soft[- ]?CI|软门禁|follow-up|后续|关注|CodeRabbit|review readiness|not[_ -]?reached)/gi,
      "mark-info"
    ],
    [
      /(导出 API|\bAPI\b|兼容性|\bsession\b|\brunner\b|\bmemory\b|GraphRAG|workspace_exec|OpenAPI|\bpolicy\b|security|安全)/gi,
      "mark-warn"
    ]
  ];
  for (const [pattern, className] of replacements) {
    html = html.replace(pattern, `<mark class="${className}">$1</mark>`);
  }
  return html;
}

      });
    }
  }
  const skipped = [...skippedByNumber.values()];
  return [
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || []),
    ...skipped
  ];
}

function skippedGroups() {
  const processedNumbers = new Set([
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || [])
  ].map(item => Number(item.number)).filter(Boolean));
  return (reportData.skipped_groups || []).map(group => {
    const existingItems = group.items || [];
    if (existingItems.length) {
      return {
        ...group,
        items: existingItems.filter(item => !processedNumbers.has(Number(item.number)))
      };
    }
    const items = (group.prs || []).filter(number => !processedNumbers.has(Number(number))).map(number => {
      const reason = group.reason || "skipped";
      const summary = text(group.title_zh || group.title || reason);
      return {
        number,
        title: `PR #${number}`,
        url: "",
        author: "",
        status: "skipped",
        skip_reason: summary,
        readiness_audit: summary,
        ci_state: "",
        blockers: [{
          kind: reason,
          summary
        }]
      };
    });
    return { ...group, items, count: items.length };
  }).filter(group => group.items.length > 0);
}

function counts(items) {
  const result = Object.fromEntries(statusOrder.map(status => [status, 0]));
  for (const item of items) {
    const status = item.status || "skipped";
    result[status] = (result[status] || 0) + 1;
  }
  return result;
}

function matchesSearch(item, query) {
  if (!query) return true;
  const haystack = [
    item.number,
    text(item.title),
    item.author,
    text(item.problem),
    text(item.necessity_assessment),
    text(item.evidence_checked),
    text(item.reproduction_on_base),
    text(item.issue_evidence_gaps),
    text(item.approach),
    text(item.implementation_derivation),
    text(item.solution_fit_assessment),
    text(item.outcome),
    text(item.merge_policy),
    text(item.skip_reason),
    text(item.group_reason),
    text(item.readiness_audit),
    blockersSearchText(item.blockers),
    text(item.risk),
    text(item.ci_state)
  ].join(" ").toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function blockersSearchText(blockers) {
  if (!Array.isArray(blockers)) return "";
  return blockers.map(blocker => {
    if (typeof blocker !== "object" || blocker === null) return text(blocker);
    return [
      blocker.kind,
      blocker.summary,
      blocker.reviewer,
      blocker.path,
      blocker.line,
      blocker.latest_response,
      blocker.verification,
      blocker.url
    ].map(value => text(value)).join(" ");
  }).join(" ");
}

function field(label, value) {
  const body = text(value);
  if (!body) return "";
  return `<div class="field"><strong>${label}</strong><div class="field-body">${formatRich(body)}</div></div>`;
}

function renderBlockers(item) {
  const blockers = Array.isArray(item.blockers) ? item.blockers : [];
  if (!blockers.length) return "";
  const isNonBlockerList = blockers.every(blocker => {
    const kind = typeof blocker === "object" && blocker !== null ? String(blocker.kind || "") : "";
    return kind === ("not" + "_reached") || kind === "状态刷新";
  });
  const detailLabel = isNonBlockerList
    ? labels[lang].nonBlockerDetails
    : labels[lang].blockerDetails;
  const rendered = blockers.map(blocker => {
    const data = typeof blocker === "object" && blocker !== null
      ? blocker
      : { summary: blocker };
    const location = [data.path, data.line ? `:${data.line}` : ""].filter(Boolean).join("");
    const meta = [
      data.kind ? blockerKindLabel(data.kind) : "",
      data.reviewer ? `reviewer: ${text(data.reviewer)}` : "",
      location,
      data.latest_response ? `latest: ${text(data.latest_response)}` : "",
      data.verification ? text(data.verification) : ""
    ].filter(Boolean).join(" · ");
    const summary = formatRich(data.summary || blocker);
    const link = data.url
      ? ` <a href="${escapeHtml(data.url)}">link</a>`
      : "";
    return `<li class="blocker-item"><div>${summary}${link}</div>${meta ? `<div class="blocker-meta">${escapeHtml(meta)}</div>` : ""}</li>`;
  }).join("");
  return `<div class="skip-detail"><strong>${detailLabel}:</strong></div><ul class="blocker-list">${rendered}</ul>`;
}

function blockerKindLabel(kind) {
  return (labels[lang].blockerKinds || {})[kind] || text(kind);
}

  function inlineCommentText(comment) {
    if (comment === undefined || comment === null) return "";
    if (typeof comment !== "object" || Array.isArray(comment)) {
      return text(comment);
    }
    if (lang === "zh") {
      return text(comment.summary_zh || comment.summary || comment.body || comment.message || "");
    }
    return text(comment.body || comment.summary_en || comment.summary || comment.message || "");
  }

function allPrText(item) {
  const comments = (item.inline_comments || []).map(comment => [
    comment.severity,
    comment.focus,
    comment.body,
    comment.summary,
    comment.path
  ].map(value => text(value)).join(" ")).join(" ");
  const blockers = blockersSearchText(item.blockers);
  return [
    item.status,
    item.number,
    item.title,
    item.author,
    item.problem,
    item.necessity_assessment,
    item.evidence_checked,
    item.reproduction_on_base,
    item.issue_evidence_gaps,
    item.approach,
    item.implementation_derivation,
    item.solution_fit_assessment,
    item.outcome,
    item.risk,
    item.ci_state,
    item.skip_reason,
    item.readiness_audit,
    item.modules,
    item.api_surface,
    comments,
    blockers
  ].map(value => text(value)).join(" ").toLowerCase();
}

function readingAdvice(item) {
  const status = item.status || "skipped";
  const comments = item.inline_comments || [];
  const blockers = item.blockers || [];
  const body = allPrText(item);
  const hasP1 = comments.some(comment =>
    /\bP[01]\b/i.test(text(comment.severity)) ||
    /\bP[01]\b/i.test(inlineCommentText(comment))
  );
  const hasCriticalRisk = hasP1 ||
    /(security|安全|bypass|绕过|breaking|破坏性|unbounded|无界|丢失|重复|不稳定|兼容|api|go-apidiff|failure|失败|不能 merge|不能合入|race|并发)/i.test(body);
  const highImpactFeature =
    /(add|new|新增|support|支持|agent|runner|session|memory|graphrag|knowledge|openapi|workspace_exec|policy|extension|tool|graph|api)/i.test(body);

  const copy = {
    critical: {
      icon: "🔥",
      zh: "重点精读",
      en: "Deep Read",
      reasonZh: comments.length
        ? `有 ${comments.length} 条行级评论，且包含 P1/兼容/正确性/安全类风险。`
        : "包含高风险兼容性或正确性信号，需要重点复核。",
      reasonEn: comments.length
        ? `${comments.length} inline comment(s), including P1, compatibility, correctness, or security risk.`
        : "High-risk compatibility or correctness signal; review carefully."
    },
    focus: {
      icon: "🔎",
      zh: "建议细看",
      en: "Read Carefully",
      reasonZh: comments.length
        ? `有 ${comments.length} 条评论或重要设计取舍，建议看完整结论。`
        : "涉及核心模块、导出 API 或较大功能，建议细看。",
      reasonEn: comments.length
        ? `${comments.length} comment(s) or important design tradeoffs; read the full conclusion.`
        : "Core module, exported API, or larger feature; read carefully."
    },
    skim: {
      icon: "✅",
      zh: "快速略看",
      en: "Quick Skim",
      reasonZh: "风险低或改动较直接，扫结论和 CI 状态即可。",
      reasonEn: "Low risk or straightforward change; skim outcome and CI state."
    },
    follow: {
      icon: "⏳",
      zh: "只看阻塞",
      en: "Blocker Only",
      reasonZh: blockers.length
        ? `主要看 ${blockers.length} 个具体阻塞点，暂不需要读完整实现。`
        : "当前不是可合并状态，先看阻塞和后续动作。",
      reasonEn: blockers.length
        ? `Focus on ${blockers.length} concrete blocker(s); no need to read the full implementation yet.`
        : "Not merge-ready; focus on blockers and next action."
    }
  };

  let level = "skim";
  if (status === "blocked") {
    level = "follow";
  } else if (status === "commented") {
    level = hasCriticalRisk ? "critical" : "focus";
  } else if (status === "maintained") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "approved") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "merged") {
    level = highImpactFeature || hasCriticalRisk ? "focus" : "skim";
  } else if (status === "skipped") {
    level = blockers.length || /(conflict|ci|failure|失败|未回应|review)/i.test(body)
      ? "follow"
      : "skim";
  }

  const selected = copy[level];
  return {
    level,
    icon: selected.icon,
    label: lang === "zh" ? selected.zh : selected.en,
    reason: lang === "zh" ? selected.reasonZh : selected.reasonEn
  };
}

function priorityRank(level) {
  return { critical: 4, focus: 3, follow: 2, skim: 1 }[level] || 0;
}

function renderReadingGuide(items) {
  const panel = document.getElementById("readingGuidePanel");
  const container = document.getElementById("readingGuide");
  const candidates = [
    ...items.filter(item => (item.status || "skipped") !== "skipped"),
    ...(reportData.follow_up || []).map(item => {
      if (typeof item === "object" && item !== null && !Array.isArray(item)) {
        return { ...item, status: item.status || "blocked" };
      }
      const body = text(item);
      return { title: body, next: body, status: "blocked", plain: true };
    })
  ].map(item => ({ item, advice: readingAdvice(item) }))
    .filter(entry => entry.advice.level !== "skim")
    .sort((left, right) => priorityRank(right.advice.level) - priorityRank(left.advice.level));

  if (!candidates.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }

  panel.style.display = "block";
  container.innerHTML = candidates.slice(0, 9).map(entry => {
    const item = entry.item;
    const advice = entry.advice;
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText} · ${escapeHtml(text(item.title))}</a>`
      : `<span>${prText} · ${escapeHtml(text(item.title))}</span>`;
    return `
      <article class="guide-card ${advice.level}">
        <div class="guide-meta">
          <span class="read-pill ${advice.level}">${advice.icon} ${escapeHtml(advice.label)}</span>
          <span class="badge ${item.status || "skipped"}">${labels[lang][item.status] || item.status || labels[lang].skipped}</span>
        </div>
        <div>${prLink}</div>
        <div class="guide-reason">${escapeHtml(advice.reason)}</div>
      </article>
    `;
  }).join("");
}

            <span class="badge ${status}">${labels[lang][status] || status}</span>
            <button class="card-toggle" type="button" aria-expanded="false">${labels[lang].expandDetails}</button>
          </div>
        </div>
        <div class="card-body">
          ${renderPrReadout(item)}
        </div>
      </article>
    `;
  }).join("");
  document.querySelectorAll(".card-head").forEach(head => {
    head.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      const card = head.closest(".card");
      setCardOpen(card, !card.classList.contains("open"));
    });
  });
  document.querySelectorAll(".card").forEach(card => updateCardToggle(card));
}

function renderSkipGroups() {
  const heading = document.getElementById("skippedHeading");
  const container = document.getElementById("skipGroups");
  if (!["all", "skipped"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  const query = document.getElementById("search").value.trim();
  const groups = skippedGroups().map(group => {
    const reason = group.reason || "";
    const title = lang === "zh"
      ? text(group.title_zh || group.label || group.title || group.reason)
      : text(group.title_en || group.label_en || group.label || group.title || group.reason);
    const items = (group.items || []).map(item => ({
      ...item,
      status: item.status || "skipped",
      group_reason: reason,
      skip_reason: item.skip_reason || reason
    })).filter(item => matchesSearch(item, query));
    return { reason, title, items };
  }).filter(group => group.items.length > 0);
  if (!groups.length) {
    container.innerHTML = `<div class="empty">${labels[lang].empty}</div>`;
    return;
  }
  container.innerHTML = groups.map((group, index) => `
    <article class="skip-group open">
      <div class="skip-group-head" data-skip-group="${index}">
        <h3 class="skip-group-title">${escapeHtml(text(group.title || group.reason))}</h3>
        <span class="skip-group-count">${group.items.length} ${labels[lang].items}</span>
      </div>
      <div class="skip-group-body">
        ${group.items.map(item => {
          const prText = item.number ? `#${item.number}` : "PR";
          const prLink = item.url
            ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
            : prText;
          return `
            <div class="skip-row">
              <div>
                <div class="skip-title">${prLink} · ${escapeHtml(text(item.title))}</div>
                <div class="skip-detail">${labels[lang].author}: ${escapeHtml(item.author || "")}</div>
              </div>
              <div>
                <div><strong>${labels[lang].reason}:</strong> ${formatRich(text(item.skip_reason))}</div>
                ${item.readiness_audit ? `<div class="skip-detail"><strong>${labels[lang].readinessAudit}:</strong> ${formatRich(text(item.readiness_audit))}</div>` : ""}
                ${item.necessity_assessment ? `<div class="skip-detail"><strong>${labels[lang].necessityAssessment}:</strong> ${formatRich(text(item.necessity_assessment))}</div>` : ""}
                ${item.evidence_checked ? `<div class="skip-detail"><strong>${labels[lang].evidenceChecked}:</strong> ${formatRich(text(item.evidence_checked))}</div>` : ""}
                ${item.reproduction_on_base ? `<div class="skip-detail"><strong>${labels[lang].reproductionOnBase}:</strong> ${formatRich(text(item.reproduction_on_base))}</div>` : ""}
                ${item.issue_evidence_gaps ? `<div class="skip-detail"><strong>${labels[lang].issueEvidenceGaps}:</strong> ${formatRich(text(item.issue_evidence_gaps))}</div>` : ""}
                ${item.implementation_derivation ? `<div class="skip-detail"><strong>${labels[lang].implementationDerivation}:</strong> ${formatRich(text(item.implementation_derivation))}</div>` : ""}
                ${item.solution_fit_assessment ? `<div class="skip-detail"><strong>${labels[lang].solutionFitAssessment}:</strong> ${formatRich(text(item.solution_fit_assessment))}</div>` : ""}
                ${renderBlockers(item)}
                ${item.ci_state ? `<div class="skip-detail">${formatRich(text(item.ci_state))}</div>` : ""}
                ${item.risk ? `<div class="skip-detail">${formatRich(text(item.risk))}</div>` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `).join("");
  document.querySelectorAll("[data-skip-group]").forEach(head => {
    head.addEventListener("click", () => {
      head.closest(".skip-group").classList.toggle("open");
    });
  });
}

function renderFollowUp() {
  const heading = document.getElementById("followUpHeading");
  const container = document.getElementById("followUpCards");
  if (!["all", "skipped", "blocked"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  const query = document.getElementById("search").value.trim().toLowerCase();
  const items = (reportData.follow_up || []).map(item => {
    if (typeof item === "object" && item !== null && !Array.isArray(item)) return item;
    const body = text(item);
    return {
      title: body,
      next: body,
      plain: true
    };
  }).filter(item => {
    if (!query) return true;
    return [
      item.number,
      item.author,
      text(item.title),
      text(item.reason),
      text(item.next)
    ].join(" ").toLowerCase().includes(query);
  });
  if (!items.length) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  container.innerHTML = items.map(item => {
    const hasPrIdentity = Boolean(item.number || item.url);
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
      : prText;
    const title = formatRich(text(item.title || item.next || item.reason));
    const cardTitle = hasPrIdentity ? `${prLink} · ${title}` : title;
    const meta = item.author
      ? `<div class="meta">${labels[lang].author}: ${escapeHtml(item.author)}</div>`
      : "";
    const body = item.plain
      ? `<div>${formatRich(text(item.next || item.title))}</div>`
      : `<div class="grid">
          ${field(labels[lang].reason, item.reason)}
          ${field(labels[lang].outcome, item.next)}
        </div>`;
    return `
      <article class="card open" data-status="blocked">
        <div class="card-head">
          <div>
            <h3 class="card-title">${cardTitle}</h3>
            ${meta}
          </div>
          <span class="badge blocked">${labels[lang].followups}</span>
        </div>
        <div class="card-body">
          ${body}
        </div>
      </article>
    `;
  }).join("");
}

function renderEvolution() {
  const panel = document.getElementById("evolutionPanel");
  const container = document.getElementById("evolutionList");
  const items = reportData.skill_evolution || [];
  if (!items.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }
  panel.style.display = "block";
  container.innerHTML = items.map(item => {
    const data = typeof item === "object" && item !== null && !Array.isArray(item)
      ? item
      : { area: labels[lang].selfEvolutionSection, note: item };
    return `
      <article class="evolution-item">
        <div class="evolution-area">${escapeHtml(text(data.area || labels[lang].selfEvolutionSection))}</div>
        <div class="evolution-note">${formatRich(text(data.note || data.summary || data.body || ""))}</div>
      </article>
    `;
  }).join("");
}

function render() {
  const items = prs();
  renderStatic();
  renderMetrics(items);
  renderBars(items);
  renderTimeline();
  renderOverview();
  renderReadingGuide(items);
  renderChips();
  renderCards();
  renderSkipGroups();
  renderFollowUp();
  renderEvolution();
}

document.querySelectorAll("[data-lang-button]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.langButton));
});
document.getElementById("search").addEventListener("input", () => {
  renderCards();
  renderSkipGroups();
  renderFollowUp();
});
document.getElementById("openAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, true));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.add("open"));
});
document.getElementById("closeAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, false));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.remove("open"));
});
render();
</script>
</body>
</html>
