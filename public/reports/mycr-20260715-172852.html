.card[data-status="skipped"] .card-head { border-left-color: var(--info); }
.card[data-status="blocked"] .card-head { border-left-color: var(--bad); }
.card.priority-critical .card-head {
  background: linear-gradient(180deg, #fff7f8, #fff);
}
.card.priority-focus .card-head {
  background: linear-gradient(180deg, #fffbeb, #fff);
}
.card.priority-follow .card-head {
  background: linear-gradient(180deg, #eff6ff, #fff);
}
.card-title {
  font-size: 16px;
  line-height: 1.42;
}
.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 7px;
}
.badge {
  gap: 7px;
  min-width: 0;
  padding: 6px 11px;
  text-transform: none;
  white-space: nowrap;
}
.card-summary {
  color: #526173;
  margin-top: 9px;
}
.badge::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.card-body {
  background: #fff;
  padding: 0 18px 18px;
}
.grid {
  grid-template-columns: 1fr;
  gap: 10px;
}
.field {
  background: #fbfcfe;
  border-color: #e6ecf3;
  padding: 13px 14px;
}
.field strong {
  color: #536175;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: uppercase;
}
.field-body {
  color: #1f2937;
  line-height: 1.62;
}
.comment {
  background: #fff8ed;
  border-left-color: var(--accent-2);
  color: #1f2937;
}
.comment-head {
  color: #1f2937;
}
.pr-readout {
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}
.story-block {
  border-top-color: #e2e8f0;
}
.story-block.hero-block {
  background: linear-gradient(180deg, #fbfffe, #f7fbfa);
  border-color: #d5e7e4;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
}
.story-block h4,
.review-rail h4,
.comments-panel h4 {
  font-size: 13px;
  font-weight: 900;
}
.story-line {
  grid-template-columns: 116px minmax(0, 1fr);
  border-top-color: #e9eef5;
}
.story-label {
  color: #607086;
}
.review-rail {
  border: 1px solid #e3eaf2;
  border-radius: 8px;
  padding: 14px;
  background: #fbfcfe;
}
.review-rail .fact-list {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.fact {
  border-top-color: #e8eef5;
}
.comments-panel {
  border-top-color: #e2e8f0;
}
.comment-list {
  gap: 12px;
}
.skip-group {
  box-shadow: var(--shadow);
}
.skip-group-head {
  align-items: center;
  background: linear-gradient(180deg, #fff, #fbfcfe);
}
.skip-row {
  grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.85fr);
}
.blocker-item {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
}
.empty {
  background: #fff;
  box-shadow: var(--shadow);
}
@media (max-width: 840px) {
  .topbar, .card-head { grid-template-columns: 1fr; display: grid; }
  .card-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .dashboard, .grid, .metrics { grid-template-columns: 1fr; }
  .guide-grid { grid-template-columns: 1fr; }
  .headline-row { align-items: flex-start; flex-direction: column; }
  .pr-readout { grid-template-columns: 1fr; }
  .review-rail { position: static; }
  .story-line { grid-template-columns: 1fr; gap: 4px; }
  .timeline-item { grid-template-columns: 1fr; }
  .controls { position: static; }
  .utilities { width: 100%; margin-left: 0; }
  .utility-button { flex: 1 1 auto; }
  .skip-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1 data-i18n="title">MyCR 审核报告</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="toggle" aria-label="Language">
      <button type="button" data-lang-button="zh" class="active">中文</button>
      <button type="button" data-lang-button="en">EN</button>
    </div>
  </div>
  <section class="metrics" id="metrics"></section>
  <section class="dashboard">
    <div class="panel">
      <h2 data-i18n="statusDistribution">状态分布</h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="timeline">执行时间线</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
  <section class="panel" id="overviewPanel" style="display: none; margin-top: 16px;">
    <h2 data-i18n="overviewSection">整体摘要</h2>
    <div class="overview-content" id="overviewContent"></div>
  </section>
  <section class="panel reading-guide" id="readingGuidePanel" style="display: none;">
    <div class="guide-head">
      <h2 data-i18n="readingGuide">阅读建议</h2>
      <span data-i18n="readingGuideHint">先看高风险和高影响 PR</span>
    </div>
    <div class="guide-grid" id="readingGuide"></div>
  </section>
  <section class="controls">
    <input class="search" id="search" type="search">
    <div class="chips" id="chips"></div>
    <div class="utilities">
      <button type="button" class="utility-button" id="openAll"></button>
      <button type="button" class="utility-button" id="closeAll"></button>
    </div>
  </section>
  <section class="section-heading">
    <h2 data-i18n="reviewedSection">已处理 PR</h2>
    <div class="hint" data-i18n="reviewedHint">点击卡片查看细节</div>
  </section>
  <main class="cards" id="cards"></main>
  <section class="section-heading" id="skippedHeading">
    <h2 data-i18n="skippedGroups">未审核 PR 分类</h2>
    <div class="hint" data-i18n="skippedHint">按排除原因分组</div>
  </section>
  <section class="skip-groups" id="skipGroups"></section>
  <section class="section-heading" id="followUpHeading">
    <h2 data-i18n="followUpSection">后续关注</h2>
    <div class="hint" data-i18n="followUpHint">接近可处理但仍有阻塞</div>
  </section>
  <section class="cards" id="followUpCards"></section>
  <section class="panel" id="evolutionPanel" style="display: none; margin-top: 18px;">
    <h2 data-i18n="selfEvolutionSection">自进化记录</h2>
    <div class="evolution-list" id="evolutionList"></div>
  </section>
  <div class="footer" id="footer"></div>
</div>
<script>
const reportData = {"approved":[],"blocked":[],"commented":[{"alternative_designs":"A typed closed-channel sentinel or an event-layer best-effort mode could isolate closed-channel recovery without swallowing timeout and context failures.","api_surface":"No new exported API, but observable EventEmitter error behavior changes.","approach":"The patch adds local recover blocks around event sends and converts the graph emitter to best-effort delivery.","attention_points":["event/event.go:523 slow-path event snapshot race","graph/emitter.go:240 emitter error propagation","event/event.go:454 fast-path panic log detail"],"author":"xiaoyulox","behavior_impact":"Trace logging can race with receiver mutation on the slow path, and production warning logs can be missing event details.","change_inventory":"Event send helpers, graph emitter wrapper, and event logging behavior were changed.","ci_state":"Effective checks refreshed: 162 checks, non-green=1; examples: codecov/patch=FAILURE.","cross_module_impact":"Runner observability and trace logging depend on the same event snapshots.","design_assessment":"The design is close but currently mixes a resilience fix with behavior changes that callers can observe.","evidence_checked":"Current PR head 440abbff3266f7e91f6acfd416df40f331b51261, changed files from GitHub pulls/files, fresh PR 状态信息, effective checks, existing review comments where present, and second-pass review notes.","head_sha":"440abbff3266f7e91f6acfd416df40f331b51261","implementation_derivation":"The modified paths are exactly the channel-send wrappers used by normal graph event delivery, so small changes here affect all graph node event semantics.","inline_comments":[{"body":"`snapshotEvent(e)` runs after `ch <- e`, so a receiver can mutate the event before the trace log reads it and reintroduce the data race this code previously avoided. Snapshot once before the slow-path `select` and reuse that value for both no-timeout and timeout success logs.\n<details><summary>中文<\/summary>\n`snapshotEvent(e)` 现在发生在 `ch <- e` 成功之后，接收方可能已经开始修改这个 event，trace 日志再读取它就会重新引入这段代码之前专门避免的数据竞争。建议在慢路径 `select` 之前先做一次 snapshot，并在无 timeout 和有 timeout 的成功日志里复用这个值。\n<\/details>","focus":"slow-path event snapshot race","line":523,"path":"event/event.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2231#discussion_r3586200540"},{"body":"`emitWithRecover` now drops every `EmitEventWithTimeout` error, not just recovered closed-channel panics, so timeout and canceled-context failures look successful to graph nodes. Preserve timeout/context errors and only suppress the specific closed-channel recovery case, with a regression for canceled contexts.\n<details><summary>中文<\/summary>\n`emitWithRecover` 现在会吞掉所有 `EmitEventWithTimeout` 错误，而不只是关闭 channel 的 panic 恢复，所以 timeout 或 context canceled 的发送失败会被 graph 节点当成成功。建议继续返回 timeout/context 错误，只对关闭 channel 的恢复场景做 best-effort 吞掉，并补一个 canceled context 的回归测试。\n<\/details>","focus":"emitter error propagation","line":240,"path":"graph/emitter.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2231#discussion_r3586200774"},{"body":"`eventStr` is still used for fast-path panic logging, so production logs with trace disabled can lose the event details this fix is meant to preserve. Use `redactedEventForLogging(e)` in the recovery log and keep `eventStr` only for successful trace output.\n<details><summary>中文<\/summary>\nfast path 的 panic 日志仍然使用 `eventStr`，而 trace 关闭时它会是空字符串，生产日志会丢掉这次修复本来想保留的 event 细节。建议 recovery 日志改用 `redactedEventForLogging(e)`，`eventStr` 只用于成功发送时的 trace 输出。\n<\/details>","focus":"fast-path panic log detail","line":454,"path":"event/event.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2231#discussion_r3586200975"}],"issue_evidence_gaps":"The linked issue fit remains unclear because the PR fixes event panic recovery rather than the full requested code-review agent.","merge_policy":"blocked_by_review_findings","module_impact":"Graph node execution can lose event-delivery failures that previously reached callers.","modules":"event, graph","necessity_assessment":"plausible_but_unproven: the event panic fix is useful independently, but it does not implement the linked full code-review-agent issue.","number":2231,"outcome":"Three inline comments were posted on the current head.","problem":"The change tries to recover from sends to closed event channels, but it also changes when events are snapshotted for logging and how graph emitter errors are propagated.","problem_framing":"Closed-channel recovery is useful only if it does not reintroduce races, hide cancellation, or make production recovery logs less informative.","reproduction_on_base":"Direct full reproduction was not run for every scenario; the findings are derived from current changed code paths and existing test/report contracts.","review_action":"Posted 3 inline GitHub comments; no approval, LGTM, request-changes review, or merge was submitted.","risk":"Concurrency and observability regression risk remains until the posted comments are addressed.","root_cause":"The slow path snapshots after channel send, the graph wrapper discards all send errors, and the fast-path recovery uses a trace-only snapshot string.","semantic_changes":"Closed-channel panic is converted to an error or nil, but timeout/cancel delivery failures may now be hidden from graph callers.","solution_fit_assessment":"The panic boundary is the right layer, but the implementation needs narrower error suppression and pre-send snapshots to preserve existing contracts.","status":"commented","technical_background":"The event package emits runner events into channels that downstream graph and runner code consume asynchronously. These events are mutable structs, so send-time ownership and error propagation are part of the concurrency contract.","tests_docs":"Needs regression tests for canceled contexts, timeout propagation, and closed-channel recovery logs.","title":"fix: fix panic recovery vulnerability in event emission","tradeoffs":"Recovering from closed-channel panics improves resilience, but broad suppression weakens backpressure and makes missed events harder to diagnose.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2231"},{"alternative_designs":"Per-case backend service construction would avoid several shared-state risks; a sidecar checksum keeps JSON compatibility while preserving integrity checks.","api_surface":"Adds a new nested Go module and public replaytest helper APIs.","approach":"The PR introduces a nested replaytest module with backend factories, normalization, diffing, reports, and public replay cases.","attention_points":["session/replaytest/harness.go:109 per-case allowed diffs ignored","session/replaytest/harness.go:604 parallel suite state isolation","session/replaytest/harness.go:1212 invalid json report footer","session/replaytest/README-en.md:48 nested module commands","session/replaytest/cases_test.go:423 dropped create-session error"],"author":"BG0527","behavior_impact":"Current bugs can produce false failures, false passes, or reports that external JSON tools cannot parse.","change_inventory":"Adds replay cases, backend factories, normalization, diff engine, report writing, and English/Chinese docs.","ci_state":"Effective checks refreshed: 164 checks, non-green=0.","cross_module_impact":"Future persistent backend changes may use this module as acceptance evidence.","design_assessment":"The architecture is promising, with correctness gaps in the execution and reporting contract.","evidence_checked":"Current PR head bf2ebf58a728aeddb94055379bd7382d937bfa2e, changed files from GitHub pulls/files, fresh PR 状态信息, effective checks, existing review comments where present, and second-pass review notes.","head_sha":"bf2ebf58a728aeddb94055379bd7382d937bfa2e","implementation_derivation":"The posted comments target the harness and case/doc lines where those contracts are encoded.","inline_comments":[{"body":"`Case.AllowedDiffs` is never merged into `Harness.Run`, so per-case expected backend differences are ignored unless callers manually copy them into `Harness.Allowed`. Validate and compare against `append(h.Allowed, replayCase.AllowedDiffs...)`, including golden and scoped-state comparisons.\n<details><summary>中文<\/summary>\n`Case.AllowedDiffs` 没有合并进 `Harness.Run`，所以每个 case 自己声明的可接受后端差异会被忽略，除非调用方手动复制到 `Harness.Allowed`。建议在这里把 `h.Allowed` 和 `replayCase.AllowedDiffs` 合并后再校验和比较，并让 golden、scoped state 比较也使用同一份规则。\n<\/details>","focus":"per-case allowed diffs ignored","line":109,"path":"session/replaytest/harness.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3586201203"},{"body":"`backendsForCase` only changes `SessionID`, so parallel cases still share `AppName` and `UserID` and can collide through app/user state or memory stores. Isolate the full session key per case or create fresh backend services, and add a parallel state/memory regression.\n<details><summary>中文<\/summary>\n`backendsForCase` 只改了 `SessionID`，并行 case 仍然共享 `AppName` 和 `UserID`，因此 app state、user state 或 memory 存储可能互相污染。建议为每个 case 隔离完整 session key，或者为每个 case 创建新的 backend service，并补一个并行 state/memory 的回归测试。\n<\/details>","focus":"parallel suite state isolation","line":604,"path":"session/replaytest/harness.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3586201397"},{"body":"`WriteReport` appends a `// sha256` footer to a `.json` report, so the framework output is not valid JSON for standard parsers. Keep the report valid JSON and move the checksum to a sidecar `.sha256` file or a JSON field with documented canonicalization.\n<details><summary>中文<\/summary>\n`WriteReport` 会在 `.json` 报告末尾追加 `// sha256` footer，导致框架输出对标准 JSON parser 来说不是合法 JSON。建议保持报告本身为合法 JSON，把 checksum 移到 `.sha256` sidecar 文件，或作为有明确 canonicalization 规则的 JSON 字段。\n<\/details>","focus":"invalid json report footer","line":1212,"path":"session/replaytest/harness.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3586201578"},{"body":"These root-level `go test ./session/replaytest/` commands do not work because `session/replaytest` is a nested Go module with its own `go.mod`. Document `cd session/replaytest && CGO_ENABLED=1 go test . -v` for the lightweight matrix, and make the matching README-zh commands use the same module-local form.\n<details><summary>中文<\/summary>\n这些从仓库根目录执行的 `go test ./session/replaytest/` 命令跑不起来，因为 `session/replaytest` 是带独立 `go.mod` 的嵌套 Go module。建议把轻量矩阵写成 `cd session/replaytest && CGO_ENABLED=1 go test . -v`，并让 README-zh 里的对应命令也改成同样的 module-local 形式。\n<\/details>","focus":"nested module commands","line":48,"path":"session/replaytest/README-en.md","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3586201780"},{"body":"`CreateSession` errors are dropped here, so this case can continue with app/user state updates after backend setup failed and still produce a misleading pass or diff. Return the `CreateSession` error like the other cases do.\n<details><summary>中文<\/summary>\n这里丢掉了 `CreateSession` 的错误，所以后端 session 创建失败后，这个 case 仍然会继续执行 app/user state 更新，最后可能得到误导性的通过结果或 diff。建议像其他 case 一样检查并返回 `CreateSession` 的错误。\n<\/details>","focus":"dropped create-session error","line":423,"path":"session/replaytest/cases_test.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3586201957"}],"issue_evidence_gaps":"No additional issue evidence is needed for the specific code findings; fixes should add targeted regression tests.","merge_policy":"blocked_by_review_findings","module_impact":"Session and memory backend maintainers gain a reusable consistency matrix once the harness semantics are fixed.","modules":"session/replaytest, test report documentation","necessity_assessment":"confirmed: the linked problem or feature need matches the reviewed change direction, while the posted findings identify remaining blockers.","number":2225,"outcome":"Five inline comments were posted on the current head.","problem":"The framework mostly matches the requested consistency-testing direction, but several framework paths can ignore declared acceptable diffs, cross-contaminate parallel cases, or emit invalid report JSON.","problem_framing":"A replay harness is only useful if the test contract, isolation boundary, and report format are deterministic and usable by standard tooling.","reproduction_on_base":"Direct full reproduction was not run for every scenario; the findings are derived from current changed code paths and existing test/report contracts.","review_action":"Posted 5 inline GitHub comments; no approval, LGTM, request-changes review, or merge was submitted.","risk":"Framework trust risk remains until the execution contract and report format are corrected.","root_cause":"Case-local allowed diffs are not merged in the harness, parallel isolation only changes session ID, the checksum footer violates JSON syntax, docs use the wrong module path, and one setup error is ignored.","semantic_changes":"Introduces cross-backend consistency tests and a generated diff report format.","solution_fit_assessment":"The overall surface is a good fit for the issue, but the harness contract needs these fixes before maintainers can rely on the matrix.","status":"commented","technical_background":"The replaytest module is meant to drive identical session, memory, summary, and track operations across multiple storage backends and report precise normalized diffs.","tests_docs":"Needs harness regressions for per-case allowed diffs, parallel app/user isolation, valid JSON reports, nested-module commands, and setup error propagation.","title":"session/replaytest: add replay consistency testing framework","tradeoffs":"Richer backend coverage increases confidence, but only if isolation and report parsing stay simple and strict.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225"},{"alternative_designs":"A safe auto runtime could select container when available and fail closed with a structured report otherwise.","api_surface":"Example CLI flags and generated report behavior.","approach":"The PR adds a standalone example with deterministic rules, sandbox backends, SQLite persistence, and report output.","attention_points":["examples/skills_code_review_agent/internal/sandbox/runner.go:123 isolated runtime setup failure reporting","examples/skills_code_review_agent/internal/sandbox/checks.go:49 plain unified diff rejected by checks","examples/skills_code_review_agent/main.go:33 local runtime default"],"author":"xiaocaidie313","behavior_impact":"Current behavior can crash before recording sandbox failure, reject valid plain diffs, or run checks on the host by default.","change_inventory":"Adds review-agent CLI, sandbox runner, diff parser/checks, persistence, and report generation.","ci_state":"Effective checks refreshed: 162 checks, non-green=0.","cross_module_impact":"Sandbox failures feed report and database persistence rather than normal library APIs.","design_assessment":"The pipeline needs clearer separation between development fallback and isolated review mode.","evidence_checked":"Current PR head a76f6e309365fe9b5a91607eba2c230f557ae00f, changed files from GitHub pulls/files, fresh PR 状态信息, effective checks, existing review comments where present, and second-pass review notes.","head_sha":"a76f6e309365fe9b5a91607eba2c230f557ae00f","implementation_derivation":"The comments target the runtime setup branch, mirrored sandbox checks, and CLI default that determine whether review execution is isolated and reportable.","inline_comments":[{"body":"`--runtime=container`/`e2b` setup failures return an error from `Run`, so the pipeline exits before persisting the review report or recording a sandbox failure. Return a completed `Result` with a failed run/exception count for setup errors while still refusing local fallback for isolated runtimes.\n<details><summary>中文<\/summary>\n`--runtime=container`/`e2b` 的环境准备失败会直接从 `Run` 返回 error，导致整个流水线在写 review report 或记录 sandbox failure 之前退出。建议对 setup error 返回一个完成态 `Result`，里面记录失败的 run/exception 计数，同时仍然禁止 isolated runtime 回退到 local。\n<\/details>","focus":"isolated runtime setup failure reporting","line":123,"path":"examples/skills_code_review_agent/internal/sandbox/runner.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3586202172"},{"body":"`runChecks` still requires `diff --git`, so valid plain unified diffs accepted by the parser are rejected as sandbox failures. Accept `---`/`+++` headers plus hunks here and in `skills/code-review/scripts/run_checks.sh`, with a regression for non-git unified diffs.\n<details><summary>中文<\/summary>\n`runChecks` 仍然强制要求 `diff --git`，所以 parser 已经支持的普通 unified diff 会在 sandbox 校验阶段被误判失败。建议这里和 `skills/code-review/scripts/run_checks.sh` 同时接受 `---`/`+++` 头和 hunk，并补一个非 git unified diff 的回归测试。\n<\/details>","focus":"plain unified diff rejected by checks","line":49,"path":"examples/skills_code_review_agent/internal/sandbox/checks.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3586202349"},{"body":"`--runtime` defaults to `local`, so `--repo-path` runs `go vet` and `go test` on the host unless the caller opts into a sandbox. Default repo execution to an isolated runtime or require an explicit `--runtime=local` development override.\n<details><summary>中文<\/summary>\n`--runtime` 默认是 `local`，所以传 `--repo-path` 时会直接在宿主机上跑 `go vet` 和 `go test`，除非调用方主动切到 sandbox。建议 repo 执行默认使用隔离 runtime，或者要求开发调试场景显式传 `--runtime=local`。\n<\/details>","focus":"local runtime default","line":33,"path":"examples/skills_code_review_agent/main.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3586202483"}],"issue_evidence_gaps":"No additional issue evidence is needed for the specific code findings; fixes should add targeted regression tests.","merge_policy":"blocked_by_review_findings","module_impact":"Example users may copy the runtime defaults into their own automation.","modules":"examples/skills_code_review_agent","necessity_assessment":"confirmed: the linked problem or feature need matches the reviewed change direction, while the posted findings identify remaining blockers.","number":2222,"outcome":"Three inline comments were posted on the current head.","problem":"The latest revision fixes several earlier issues, but sandbox setup errors, plain unified diff validation, and the default host-local runtime still violate the intended isolated-review behavior.","problem_framing":"A review example that advertises sandboxed execution should record sandbox failures and avoid host execution unless explicitly requested.","reproduction_on_base":"Direct full reproduction was not run for every scenario; the findings are derived from current changed code paths and existing test/report contracts.","review_action":"Posted 3 inline GitHub comments; no approval, LGTM, request-changes review, or merge was submitted.","risk":"Sandbox reliability and safety-default risk remains until the comments are fixed.","root_cause":"The isolated runtime setup path returns an error instead of a reportable failed result, the sandbox validator still requires git-style headers, and the CLI default is local.","semantic_changes":"Introduces a review workflow that can execute validation commands against a diff or repository checkout.","solution_fit_assessment":"The example is moving toward the issue goal, but the current defaults and failure handling still make production-style sandbox guarantees too weak.","status":"commented","technical_background":"The code-review agent example combines diff parsing, sandbox execution, rule checks, persistence, and optional model review into an example workflow for automated PR analysis.","tests_docs":"Needs regressions for setup-failure result persistence, plain u let lang = "zh";

function text(value, fallback = "") {
  if (value === undefined || value === null || value === "") return fallback;
  if (typeof value === "object" && !Array.isArray(value)) {
    return value[lang] || value.zh || value.en || value.summary || value.body || value.mode || fallback;
  }
  return String(value);
}

function escapeHtml(value) {
  return text(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function linkifyPrReferences(html) {
  const repo = text(reportData.repo || "trpc-group/trpc-agent-go");
  if (!repo) return html;
  return html.replace(
    /(^|[^\w/])#(\d{3,6})\b/g,
    (match, prefix, number) =>
      `${prefix}<a href="https://github.com/${repo}/pull/${number}">#${number}</a>`
  );
}

function linkifyUrls(html) {
  return html.replace(
    /(https?:\/\/[^\s<>"']+)/g,
    (match) => {
      const trailing = (match.match(/[.,;)]+$/u) || [""])[0];
      const href = trailing ? match.slice(0, -trailing.length) : match;
      return `<a href="${href}">${href}</a>${trailing}`;
    }
  );
}

function formatRich(value) {
  let html = linkifyPrReferences(linkifyUrls(escapeHtml(value)));
  const replacements = [
    [
      /(P[0-2]|codecov\/patch=FAILURE|go-apidiff=FAILURE|go-apidiff|FAILURE|失败|阻塞|不能合入|不能 merge|未合并|破坏性|breaking|unbounded|无界|绕过|丢失|重复|不稳定|风险)/gi,
      "mark-bad"
    ],
    [
      /(LGTM|已合并|已批准|squash merge|merged|approved|CI 全绿|全绿|修复有效|\bresolved\b|\bresolve\b)/gi,
      "mark-good"
    ],
    [
      /(pending|soft[- ]?CI|软门禁|follow-up|后续|关注|CodeRabbit|review readiness|not[_ -]?reached)/gi,
      "mark-info"
    ],
    [
      /(导出 API|\bAPI\b|兼容性|\bsession\b|\brunner\b|\bmemory\b|GraphRAG|workspace_exec|OpenAPI|\bpolicy\b|security|安全)/gi,
      "mark-warn"
    ]
  ];
  for (const [pattern, className] of replacements) {
    html = html.replace(pattern, `<mark class="${className}">$1</mark>`);
  }
  return html;
}

  const skipped = [...skippedByNumber.values()];
  return [
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || []),
    ...skipped
  ];
}

function skippedGroups() {
  const processedNumbers = new Set([
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || [])
  ].map(item => Number(item.number)).filter(Boolean));
  return (reportData.skipped_groups || []).map(group => {
    const existingItems = group.items || [];
    if (existingItems.length) {
      return {
        ...group,
        items: existingItems.filter(item => !processedNumbers.has(Number(item.number)))
      };
    }
    const items = (group.prs || []).filter(number => !processedNumbers.has(Number(number))).map(number => {
      const reason = group.reason || "skipped";
      const summary = text(group.title_zh || group.title || reason);
      return {
        number,
        title: `PR #${number}`,
        url: "",
        author: "",
        status: "skipped",
        skip_reason: summary,
        readiness_audit: summary,
        ci_state: "",
        blockers: [{
          kind: reason,
          summary
        }]
      };
    });
    return { ...group, items, count: items.length };
  }).filter(group => group.items.length > 0);
}

function counts(items) {
  const result = Object.fromEntries(statusOrder.map(status => [status, 0]));
  for (const item of items) {
    const status = item.status || "skipped";
    result[status] = (result[status] || 0) + 1;
  }
  return result;
}

function matchesSearch(item, query) {
  if (!query) return true;
  const haystack = [
    item.number,
    text(item.title),
    item.author,
    text(item.problem),
    text(item.necessity_assessment),
    text(item.evidence_checked),
    text(item.reproduction_on_base),
    text(item.issue_evidence_gaps),
    text(item.approach),
    text(item.implementation_derivation),
    text(item.solution_fit_assessment),
    text(item.outcome),
    text(item.merge_policy),
    text(item.skip_reason),
    text(item.group_reason),
    text(item.readiness_audit),
    blockersSearchText(item.blockers),
    text(item.risk),
    text(item.ci_state)
  ].join(" ").toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function blockersSearchText(blockers) {
  if (!Array.isArray(blockers)) return "";
  return blockers.map(blocker => {
    if (typeof blocker !== "object" || blocker === null) return text(blocker);
    return [
      blocker.kind,
      blocker.summary,
      blocker.reviewer,
      blocker.path,
      blocker.line,
      blocker.latest_response,
      blocker.verification,
      blocker.url
    ].map(value => text(value)).join(" ");
  }).join(" ");
}

function field(label, value) {
  const body = text(value);
  if (!body) return "";
  return `<div class="field"><strong>${label}</strong><div class="field-body">${formatRich(body)}</div></div>`;
}

function renderBlockers(item) {
  const blockers = Array.isArray(item.blockers) ? item.blockers : [];
  if (!blockers.length) return "";
  const isNonBlockerList = blockers.every(blocker => {
    const kind = typeof blocker === "object" && blocker !== null ? String(blocker.kind || "") : "";
    return kind === ("not" + "_reached") || kind === "状态刷新";
  });
  const detailLabel = isNonBlockerList
    ? labels[lang].nonBlockerDetails
    : labels[lang].blockerDetails;
  const rendered = blockers.map(blocker => {
    const data = typeof blocker === "object" && blocker !== null
      ? blocker
      : { summary: blocker };
    const location = [data.path, data.line ? `:${data.line}` : ""].filter(Boolean).join("");
    const meta = [
      data.kind ? blockerKindLabel(data.kind) : "",
      data.reviewer ? `reviewer: ${text(data.reviewer)}` : "",
      location,
      data.latest_response ? `latest: ${text(data.latest_response)}` : "",
      data.verification ? text(data.verification) : ""
    ].filter(Boolean).join(" · ");
    const summary = formatRich(data.summary || blocker);
    const link = data.url
      ? ` <a href="${escapeHtml(data.url)}">link</a>`
      : "";
    return `<li class="blocker-item"><div>${summary}${link}</div>${meta ? `<div class="blocker-meta">${escapeHtml(meta)}</div>` : ""}</li>`;
  }).join("");
  return `<div class="skip-detail"><strong>${detailLabel}:</strong></div><ul class="blocker-list">${rendered}</ul>`;
}

function blockerKindLabel(kind) {
  return (labels[lang].blockerKinds || {})[kind] || text(kind);
}

  function inlineCommentText(comment) {
    if (comment === undefined || comment === null) return "";
    if (typeof comment !== "object" || Array.isArray(comment)) {
      return text(comment);
    }
    if (lang === "zh") {
      return text(comment.summary_zh || comment.summary || comment.body || comment.message || "");
    }
    return text(comment.body || comment.summary_en || comment.summary || comment.message || "");
  }

function allPrText(item) {
  const comments = (item.inline_comments || []).map(comment => [
    comment.severity,
    comment.focus,
    comment.body,
    comment.summary,
    comment.path
  ].map(value => text(value)).join(" ")).join(" ");
  const blockers = blockersSearchText(item.blockers);
  return [
    item.status,
    item.number,
    item.title,
    item.author,
    item.problem,
    item.necessity_assessment,
    item.evidence_checked,
    item.reproduction_on_base,
    item.issue_evidence_gaps,
    item.approach,
    item.implementation_derivation,
    item.solution_fit_assessment,
    item.outcome,
    item.risk,
    item.ci_state,
    item.skip_reason,
    item.readiness_audit,
    item.modules,
    item.api_surface,
    comments,
    blockers
  ].map(value => text(value)).join(" ").toLowerCase();
}

function readingAdvice(item) {
  const status = item.status || "skipped";
  const comments = item.inline_comments || [];
  const blockers = item.blockers || [];
  const body = allPrText(item);
  const hasP1 = comments.some(comment =>
    /\bP[01]\b/i.test(text(comment.severity)) ||
    /\bP[01]\b/i.test(inlineCommentText(comment))
  );
  const hasCriticalRisk = hasP1 ||
    /(security|安全|bypass|绕过|breaking|破坏性|unbounded|无界|丢失|重复|不稳定|兼容|api|go-apidiff|failure|失败|不能 merge|不能合入|race|并发)/i.test(body);
  const highImpactFeature =
    /(add|new|新增|support|支持|agent|runner|session|memory|graphrag|knowledge|openapi|workspace_exec|policy|extension|tool|graph|api)/i.test(body);

  const copy = {
    critical: {
      icon: "🔥",
      zh: "重点精读",
      en: "Deep Read",
      reasonZh: comments.length
        ? `有 ${comments.length} 条行级评论，且包含 P1/兼容/正确性/安全类风险。`
        : "包含高风险兼容性或正确性信号，需要重点复核。",
      reasonEn: comments.length
        ? `${comments.length} inline comment(s), including P1, compatibility, correctness, or security risk.`
        : "High-risk compatibility or correctness signal; review carefully."
    },
    focus: {
      icon: "🔎",
      zh: "建议细看",
      en: "Read Carefully",
      reasonZh: comments.length
        ? `有 ${comments.length} 条评论或重要设计取舍，建议看完整结论。`
        : "涉及核心模块、导出 API 或较大功能，建议细看。",
      reasonEn: comments.length
        ? `${comments.length} comment(s) or important design tradeoffs; read the full conclusion.`
        : "Core module, exported API, or larger feature; read carefully."
    },
    skim: {
      icon: "✅",
      zh: "快速略看",
      en: "Quick Skim",
      reasonZh: "风险低或改动较直接，扫结论和 CI 状态即可。",
      reasonEn: "Low risk or straightforward change; skim outcome and CI state."
    },
    follow: {
      icon: "⏳",
      zh: "只看阻塞",
      en: "Blocker Only",
      reasonZh: blockers.length
        ? `主要看 ${blockers.length} 个具体阻塞点，暂不需要读完整实现。`
        : "当前不是可合并状态，先看阻塞和后续动作。",
      reasonEn: blockers.length
        ? `Focus on ${blockers.length} concrete blocker(s); no need to read the full implementation yet.`
        : "Not merge-ready; focus on blockers and next action."
    }
  };

  let level = "skim";
  if (status === "blocked") {
    level = "follow";
  } else if (status === "commented") {
    level = hasCriticalRisk ? "critical" : "focus";
  } else if (status === "maintained") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "approved") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "merged") {
    level = highImpactFeature || hasCriticalRisk ? "focus" : "skim";
  } else if (status === "skipped") {
    level = blockers.length || /(conflict|ci|failure|失败|未回应|review)/i.test(body)
      ? "follow"
      : "skim";
  }

  const selected = copy[level];
  return {
    level,
    icon: selected.icon,
    label: lang === "zh" ? selected.zh : selected.en,
    reason: lang === "zh" ? selected.reasonZh : selected.reasonEn
  };
}

function priorityRank(level) {
  return { critical: 4, focus: 3, follow: 2, skim: 1 }[level] || 0;
}

function renderReadingGuide(items) {
  const panel = document.getElementById("readingGuidePanel");
  const container = document.getElementById("readingGuide");
  const candidates = [
    ...items.filter(item => (item.status || "skipped") !== "skipped"),
    ...(reportData.follow_up || []).map(item => {
      if (typeof item === "object" && item !== null && !Array.isArray(item)) {
        return { ...item, status: item.status || "blocked" };
      }
      const body = text(item);
      return { title: body, next: body, status: "blocked", plain: true };
    })
  ].map(item => ({ item, advice: readingAdvice(item) }))
    .filter(entry => entry.advice.level !== "skim")
    .sort((left, right) => priorityRank(right.advice.level) - priorityRank(left.advice.level));

  if (!candidates.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }

  panel.style.display = "block";
  container.innerHTML = candidates.slice(0, 9).map(entry => {
    const item = entry.item;
    const advice = entry.advice;
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText} · ${escapeHtml(text(item.title))}</a>`
      : `<span>${prText} · ${escapeHtml(text(item.title))}</span>`;
    return `
      <article class="guide-card ${advice.level}">
        <div class="guide-meta">
          <span class="read-pill ${advice.level}">${advice.icon} ${escapeHtml(advice.label)}</span>
          <span class="badge ${item.status || "skipped"}">${labels[lang][item.status] || item.status || labels[lang].skipped}</span>
        </div>
        <div>${prLink}</div>
        <div class="guide-reason">${escapeHtml(advice.reason)}</div>
      </article>
    `;
  }).join("");
}

    return `

          </div>
        </div>
        <div class="card-body">
          ${renderPrReadout(item)}
        </div>
      </article>
    `;
  }).join("");
  document.querySelectorAll(".card-head").forEach(head => {
    head.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      const card = head.closest(".card");
      setCardOpen(card, !card.classList.contains("open"));
    });
  });
  document.querySelectorAll(".card").forEach(card => updateCardToggle(card));
}

function renderSkipGroups() {
  const heading = document.getElementById("skippedHeading");
  const container = document.getElementById("skipGroups");
  if (!["all", "skipped"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  const query = document.getElementById("search").value.trim();
  const groups = skippedGroups().map(group => {
    const reason = group.reason || "";
    const title = lang === "zh"
      ? text(group.title_zh || group.label || group.title || group.reason)
      : text(group.title_en || group.label_en || group.label || group.title || group.reason);
    const items = (group.items || []).map(item => ({
      ...item,
      status: item.status || "skipped",
      group_reason: reason,
      skip_reason: item.skip_reason || reason
    })).filter(item => matchesSearch(item, query));
    return { reason, title, items };
  }).filter(group => group.items.length > 0);
  if (!groups.length) {
    container.innerHTML = `<div class="empty">${labels[lang].empty}</div>`;
    return;
  }
  container.innerHTML = groups.map((group, index) => `
    <article class="skip-group open">
      <div class="skip-group-head" data-skip-group="${index}">
        <h3 class="skip-group-title">${escapeHtml(text(group.title || group.reason))}</h3>
        <span class="skip-group-count">${group.items.length} ${labels[lang].items}</span>
      </div>
      <div class="skip-group-body">
        ${group.items.map(item => {
          const prText = item.number ? `#${item.number}` : "PR";
          const prLink = item.url
            ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
            : prText;
          return `
            <div class="skip-row">
              <div>
                <div class="skip-title">${prLink} · ${escapeHtml(text(item.title))}</div>
                <div class="skip-detail">${labels[lang].author}: ${escapeHtml(item.author || "")}</div>
              </div>
              <div>
                <div><strong>${labels[lang].reason}:</strong> ${formatRich(text(item.skip_reason))}</div>
                ${item.readiness_audit ? `<div class="skip-detail"><strong>${labels[lang].readinessAudit}:</strong> ${formatRich(text(item.readiness_audit))}</div>` : ""}
                ${item.necessity_assessment ? `<div class="skip-detail"><strong>${labels[lang].necessityAssessment}:</strong> ${formatRich(text(item.necessity_assessment))}</div>` : ""}
                ${item.evidence_checked ? `<div class="skip-detail"><strong>${labels[lang].evidenceChecked}:</strong> ${formatRich(text(item.evidence_checked))}</div>` : ""}
                ${item.reproduction_on_base ? `<div class="skip-detail"><strong>${labels[lang].reproductionOnBase}:</strong> ${formatRich(text(item.reproduction_on_base))}</div>` : ""}
                ${item.issue_evidence_gaps ? `<div class="skip-detail"><strong>${labels[lang].issueEvidenceGaps}:</strong> ${formatRich(text(item.issue_evidence_gaps))}</div>` : ""}
                ${item.implementation_derivation ? `<div class="skip-detail"><strong>${labels[lang].implementationDerivation}:</strong> ${formatRich(text(item.implementation_derivation))}</div>` : ""}
                ${item.solution_fit_assessment ? `<div class="skip-detail"><strong>${labels[lang].solutionFitAssessment}:</strong> ${formatRich(text(item.solution_fit_assessment))}</div>` : ""}
                ${renderBlockers(item)}
                ${item.ci_state ? `<div class="skip-detail">${formatRich(text(item.ci_state))}</div>` : ""}
                ${item.risk ? `<div class="skip-detail">${formatRich(text(item.risk))}</div>` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `).join("");
  document.querySelectorAll("[data-skip-group]").forEach(head => {
    head.addEventListener("click", () => {
      head.closest(".skip-group").classList.toggle("open");
    });
  });
}

function renderFollowUp() {
  const heading = document.getElementById("followUpHeading");
  const container = document.getElementById("followUpCards");
  if (!["all", "skipped", "blocked"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  const query = document.getElementById("search").value.trim().toLowerCase();
  const items = (reportData.follow_up || []).map(item => {
    if (typeof item === "object" && item !== null && !Array.isArray(item)) return item;
    const body = text(item);
    return {
      title: body,
      next: body,
      plain: true
    };
  }).filter(item => {
    if (!query) return true;
    return [
      item.number,
      item.author,
      text(item.title),
      text(item.reason),
      text(item.next)
    ].join(" ").toLowerCase().includes(query);
  });
  if (!items.length) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  container.innerHTML = items.map(item => {
    const hasPrIdentity = Boolean(item.number || item.url);
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
      : prText;
    const title = formatRich(text(item.title || item.next || item.reason));
    const cardTitle = hasPrIdentity ? `${prLink} · ${title}` : title;
    const meta = item.author
      ? `<div class="meta">${labels[lang].author}: ${escapeHtml(item.author)}</div>`
      : "";
    const body = item.plain
      ? `<div>${formatRich(text(item.next || item.title))}</div>`
      : `<div class="grid">
          ${field(labels[lang].reason, item.reason)}
          ${field(labels[lang].outcome, item.next)}
        </div>`;
    return `
      <article class="card open" data-status="blocked">
        <div class="card-head">
          <div>
            <h3 class="card-title">${cardTitle}</h3>
            ${meta}
          </div>
          <span class="badge blocked">${labels[lang].followups}</span>
        </div>
        <div class="card-body">
          ${body}
        </div>
      </article>
    `;
  }).join("");
}

function renderEvolution() {
  const panel = document.getElementById("evolutionPanel");
  const container = document.getElementById("evolutionList");
  const items = reportData.skill_evolution || [];
  if (!items.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }
  panel.style.display = "block";
  container.innerHTML = items.map(item => {
    const data = typeof item === "object" && item !== null && !Array.isArray(item)
      ? item
      : { area: labels[lang].selfEvolutionSection, note: item };
    return `
      <article class="evolution-item">
        <div class="evolution-area">${escapeHtml(text(data.area || labels[lang].selfEvolutionSection))}</div>
        <div class="evolution-note">${formatRich(text(data.note || data.summary || data.body || ""))}</div>
      </article>
    `;
  }).join("");
}

function render() {
  const items = prs();
  renderStatic();
  renderMetrics(items);
  renderBars(items);
  renderTimeline();
  renderOverview();
  renderReadingGuide(items);
  renderChips();
  renderCards();
  renderSkipGroups();
  renderFollowUp();
  renderEvolution();
}

document.querySelectorAll("[data-lang-button]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.langButton));
});
document.getElementById("search").addEventListener("input", () => {
  renderCards();
  renderSkipGroups();
  renderFollowUp();
});
document.getElementById("openAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, true));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.add("open"));
});
document.getElementById("closeAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, false));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.remove("open"));
});
render();
</script>
</body>
</html>
