.card[data-status="skipped"] .card-head { border-left-color: var(--info); }
.card[data-status="blocked"] .card-head { border-left-color: var(--bad); }
.card.priority-critical .card-head {
  background: linear-gradient(180deg, #fff7f8, #fff);
}
.card.priority-focus .card-head {
  background: linear-gradient(180deg, #fffbeb, #fff);
}
.card.priority-follow .card-head {
  background: linear-gradient(180deg, #eff6ff, #fff);
}
.card-title {
  font-size: 16px;
  line-height: 1.42;
}
.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 7px;
}
.badge {
  gap: 7px;
  min-width: 0;
  padding: 6px 11px;
  text-transform: none;
  white-space: nowrap;
}
.card-summary {
  color: #526173;
  margin-top: 9px;
}
.badge::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.card-body {
  background: #fff;
  padding: 0 18px 18px;
}
.grid {
  grid-template-columns: 1fr;
  gap: 10px;
}
.field {
  background: #fbfcfe;
  border-color: #e6ecf3;
  padding: 13px 14px;
}
.field strong {
  color: #536175;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: uppercase;
}
.field-body {
  color: #1f2937;
  line-height: 1.62;
}
.comment {
  background: #fff8ed;
  border-left-color: var(--accent-2);
  color: #1f2937;
}
.comment-head {
  color: #1f2937;
}
.pr-readout {
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}
.story-block {
  border-top-color: #e2e8f0;
}
.story-block.hero-block {
  background: linear-gradient(180deg, #fbfffe, #f7fbfa);
  border-color: #d5e7e4;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
}
.story-block h4,
.review-rail h4,
.comments-panel h4 {
  font-size: 13px;
  font-weight: 900;
}
.story-line {
  grid-template-columns: 116px minmax(0, 1fr);
  border-top-color: #e9eef5;
}
.story-label {
  color: #607086;
}
.review-rail {
  border: 1px solid #e3eaf2;
  border-radius: 8px;
  padding: 14px;
  background: #fbfcfe;
}
.review-rail .fact-list {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.fact {
  border-top-color: #e8eef5;
}
.comments-panel {
  border-top-color: #e2e8f0;
}
.comment-list {
  gap: 12px;
}
.skip-group {
  box-shadow: var(--shadow);
}
.skip-group-head {
  align-items: center;
  background: linear-gradient(180deg, #fff, #fbfcfe);
}
.skip-row {
  grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.85fr);
}
.blocker-item {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
}
.empty {
  background: #fff;
  box-shadow: var(--shadow);
}
@media (max-width: 840px) {
  .topbar, .card-head { grid-template-columns: 1fr; display: grid; }
  .card-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .dashboard, .grid, .metrics { grid-template-columns: 1fr; }
  .guide-grid { grid-template-columns: 1fr; }
  .headline-row { align-items: flex-start; flex-direction: column; }
  .pr-readout { grid-template-columns: 1fr; }
  .review-rail { position: static; }
  .story-line { grid-template-columns: 1fr; gap: 4px; }
  .timeline-item { grid-template-columns: 1fr; }
  .controls { position: static; }
  .utilities { width: 100%; margin-left: 0; }
  .utility-button { flex: 1 1 auto; }
  .skip-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1 data-i18n="title">MyCR 审核报告</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="toggle" aria-label="Language">
      <button type="button" data-lang-button="zh" class="active">中文</button>
      <button type="button" data-lang-button="en">EN</button>
    </div>
  </div>
  <section class="metrics" id="metrics"></section>
  <section class="dashboard">
    <div class="panel">
      <h2 data-i18n="statusDistribution">状态分布</h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="timeline">执行时间线</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
  <section class="panel" id="overviewPanel" style="display: none; margin-top: 16px;">
    <h2 data-i18n="overviewSection">整体摘要</h2>
    <div class="overview-content" id="overviewContent"></div>
  </section>
  <section class="panel reading-guide" id="readingGuidePanel" style="display: none;">
    <div class="guide-head">
      <h2 data-i18n="readingGuide">阅读建议</h2>
      <span data-i18n="readingGuideHint">先看高风险和高影响 PR</span>
    </div>
    <div class="guide-grid" id="readingGuide"></div>
  </section>
  <section class="controls">
    <input class="search" id="search" type="search">
    <div class="chips" id="chips"></div>
    <div class="utilities">
      <button type="button" class="utility-button" id="openAll"></button>
      <button type="button" class="utility-button" id="closeAll"></button>
    </div>
  </section>
  <section class="section-heading">
    <h2 data-i18n="reviewedSection">已处理 PR</h2>
    <div class="hint" data-i18n="reviewedHint">点击卡片查看细节</div>
  </section>
  <main class="cards" id="cards"></main>
  <section class="section-heading" id="skippedHeading">
    <h2 data-i18n="skippedGroups">未审核 PR 分类</h2>
    <div class="hint" data-i18n="skippedHint">按排除原因分组</div>
  </section>
  <section class="skip-groups" id="skipGroups"></section>
  <section class="section-heading" id="followUpHeading">
    <h2 data-i18n="followUpSection">后续关注</h2>
    <div class="hint" data-i18n="followUpHint">接近可处理但仍有阻塞</div>
  </section>
  <section class="cards" id="followUpCards"></section>
  <section class="panel" id="evolutionPanel" style="display: none; margin-top: 18px;">
    <h2 data-i18n="selfEvolutionSection">自进化记录</h2>
    <div class="evolution-list" id="evolutionList"></div>
  </section>
  <div class="footer" id="footer"></div>
</div>
<script>
const reportData = {"approved":[],"blocked":[],"commented":[{"alternative_designs":"A safer variant would use knowledge-only skill access plus a dedicated checked runner; repository staging can be based on tracked files and explicit changed files instead of whole-directory copy.","api_surface":"No library API is changed; the user-visible surface is an examples CLI and its skill/profile files.","approach":"The implementation wires llmagent skills, repository diff loading, sandbox command execution, and report persistence into a CLI example.","author":"xiaocaidie313","behavior_impact":"Without fixes, LLM mode can escape the intended policy path, full repository staging can expose local files, and standard unified diffs can be silently ignored.","blockers":[{"kind":"implementation_scope","line":94,"path":"examples/skills_code_review_agent/internal/llmreview/review.go","summary":"skill execution policy: examples/skills_code_review_agent/internal/llmreview/review.go:94","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3583921990","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."},{"kind":"implementation_scope","line":399,"path":"examples/skills_code_review_agent/internal/sandbox/runner.go","summary":"sandbox repository staging: examples/skills_code_review_agent/internal/sandbox/runner.go:399","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3583922116","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."},{"kind":"implementation_scope","line":102,"path":"examples/skills_code_review_agent/internal/diff/diff.go","summary":"unified diff parser: examples/skills_code_review_agent/internal/diff/diff.go:102","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3583922284","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."}],"change_inventory":"Adds a code-review-agent example with skill docs, LLM review path, sandbox runner, diff parser, storage, fixtures, and report outputs.","ci_state":"Candidate checks were refreshed; review comments determine the current outcome.","cross_module_impact":"Touches agent skill execution and codeexecutor concepts through example integration, without changing core packages.","design_assessment":"The example architecture is coherent, but it needs tighter boundaries before it can serve as a reliable reference implementation.","evidence_checked":"Reviewed the current head diff for llmreview, sandbox runner, diff parser, storage/report surfaces, and file patches from the GitHub files API before posting comments.","head_sha":"135a405b578aac4c3cb5de7ae806601cf5695122","implementation_derivation":"The design is derived from the existing skill/tool execution model and codeexecutor workspaces, but the new example must narrow those generic capabilities for review-specific safety.","inline_comments":[{"body":"`SkillToolProfileFull` exposes `skill_run`, but that execution path is not checked by this example's `PermissionPolicy`, so LLM mode can invoke arbitrary skill commands outside the advertised allow/deny and env whitelist. Use `SkillToolProfileKnowledgeOnly` here, or expose a purpose-built runner that applies the same permission policy before any command execution.\n<details><summary>中文<\/summary>\n`SkillToolProfileFull` 会暴露 `skill_run`，但这条执行路径没有走这个示例里的 `PermissionPolicy`，所以 LLM 模式可以绕过宣称的允许/拒绝策略和环境变量白名单去调用任意 skill 命令。这里建议改用 `SkillToolProfileKnowledgeOnly`，或者只暴露一个会先执行同一套权限校验的专用 runner。\n<\/details>","focus":"skill execution policy","line":94,"path":"examples/skills_code_review_agent/internal/llmreview/review.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3583921990"},{"body":"`PutDirectory` stages the entire host repository for `--repo-path`, which can copy `.git`, ignored/untracked files, or local secrets into the sandbox. Stage a sanitized tree instead, for example tracked files from `git archive`/`git ls-files` plus explicit changed files, and exclude `.git`, ignored files, and secret patterns.\n<details><summary>中文<\/summary>\n`PutDirectory` 会把 `--repo-path` 指向的整个宿主机仓库放进 sandbox，这可能把 `.git`、被 ignore 的文件、未跟踪产物或本地密钥一起带进去。建议改成只放入清理过的文件树，例如 `git archive`/`git ls-files` 得到的 tracked files 加上明确选择的改动文件，并排除 `.git`、ignore 文件和常见密钥模式。\n<\/details>","focus":"sandbox repository staging","line":399,"path":"examples/skills_code_review_agent/internal/sandbox/runner.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3583922116"},{"body":"`--diff-file` can be a standard unified diff, but this parser only creates `current` after `diff --git`; a patch starting with `--- old` / `+++ new` produces no `FileChange`. Initialize a file change on `--- ` when `current` is nil, attach the `+++ ` path, and add coverage for non-git unified diffs.\n<details><summary>中文<\/summary>\n`--diff-file` 声称可以接收普通 unified diff，但这里只有遇到 `diff --git` 才会创建 `current`；如果 patch 直接以 `--- old` / `+++ new` 开头，就不会产生任何 `FileChange`。建议在 `current` 为空时遇到 `--- ` 也初始化文件变更，再用 `+++ ` 绑定新路径，并补上非 git unified diff 的测试。\n<\/details>","focus":"unified diff parser","line":102,"path":"examples/skills_code_review_agent/internal/diff/diff.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3583922284"}],"merge_policy":"blocked_by_review_findings","module_impact":"Impact is scoped to examples, but copied patterns could influence downstream review tooling.","modules":"examples/skills_code_review_agent/internal/llmreview, internal/sandbox, internal/diff, CLI wiring, fixtures, and output report examples.","necessity_assessment":"The example is valuable for demonstrating a practical review workflow, but the safety model has to be correct because readers may copy it into real repositories.","number":2222,"outcome":"Posted three inline comments covering skill execution policy, repository staging hygiene, and standard unified diff parsing.","problem":"The PR adds a skills-based Go code review agent example with fake and real LLM review paths, sandbox runners, diff parsing, SQLite storage, fixtures, and generated reports.","problem_framing":"The main risks are execution authority and input trust: an LLM should not gain a command path outside the policy, and a sandbox should not receive unsanitized local repository contents.","review_action":"Posted 3 inline GitHub review comments; no approval, LGTM, request-changes review, or merge was submitted.","risk":"skill execution policy; sandbox repository staging; unified diff parser","semantic_changes":"Introduces an example flow that can parse diffs, run checks, store findings, and optionally delegate review reasoning to an LLM.","solution_fit_assessment":"The feature shape fits the example goal, while the current permission profile, repository staging, and unified-diff parsing leave correctness and security gaps.","status":"commented","technical_background":"Code review agent examples combine diff parsing, sandbox command execution, skill/tool selection, and persistent reports. The critical contract is that untrusted repository content and model-selected commands stay behind the advertised permission and sandbox boundaries.","tests_docs":"Existing fixtures and tests cover several happy paths; additional coverage is needed for standard unified diffs and sanitized staging behavior.","title":"tes:Feat cr agent","tradeoffs":"Restricting skill execution and sanitized staging adds setup code, but it keeps the example aligned with its own security claims and avoids leaking local artifacts.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222"},{"alternative_designs":"The guard can normalize `WorkingDir` and compare it against protected paths, or resolve both command file references and working directory against an allowed workspace root.","api_surface":"No public package API is changed; this is an example module and CLI surface.","approach":"The implementation parses command requests, applies deny/ask/allow rules, and emits audit/report artifacts for example scenarios.","author":"March-77","behavior_impact":"A harmless command can still run inside a protected directory, which bypasses the documented forbidden path policy.","blockers":[{"kind":"implementation_scope","line":146,"path":"examples/tool_safety_guard/guard.go","summary":"forbidden working directory: examples/tool_safety_guard/guard.go:146","url":"https://github.com/trpc-group/trpc-agent-go/pull/2193#discussion_r3583922448","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."}],"change_inventory":"Adds policy parsing, command classification, samples, audit output, and documentation for a tool safety guard.","ci_state":"Candidate checks were refreshed; review comments determine the current outcome.","cross_module_impact":"No core runtime packages are changed; the example models how tool requests should be screened.","design_assessment":"The policy model is readable and extensible; it needs one more enforcement point to match its declared behavior.","evidence_checked":"Reviewed the guard policy structures, command classifier, forbidden path logic, samples, and current PR diff before posting the inline comment.","head_sha":"03d5db98e579a3744d5d4429a327974441aa482f","implementation_derivation":"The guard derives safety decisions from policy arrays and regex classifiers, so each policy dimension has to map to the corresponding request field.","inline_comments":[{"body":"`ForbiddenPaths` only checks `req.Command`, so `WorkingDir: \"~/.ssh\"` with a harmless command can be allowed even though the guard says it protects working directories. Normalize and check `req.WorkingDir` against `ForbiddenPaths` as well, then add a sample/test for protected working dirs.\n<details><summary>中文<\/summary>\n`ForbiddenPaths` 现在只检查 `req.Command`，所以即使 `WorkingDir` 是 `~/.ssh`，只要命令本身看起来无害就可能被放行，这和 guard 宣称会保护工作目录不一致。建议把 `req.WorkingDir` 规范化后也纳入 `ForbiddenPaths` 检查，并补一个受保护工作目录的样例/测试。\n<\/details>","focus":"forbidden working directory","line":146,"path":"examples/tool_safety_guard/guard.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2193#discussion_r3583922448"}],"merge_policy":"blocked_by_review_findings","module_impact":"Impact is scoped to the example, but the policy pattern may be reused by agent tool wrappers.","modules":"examples/tool_safety_guard guard, policy JSON, samples, tests, and report examples.","necessity_assessment":"The example addresses a real safety need for agent tool execution, but protected working directories must be enforced as part of the same policy.","number":2193,"outcome":"Posted one inline comment requiring `WorkingDir` enforcement for forbidden paths.","problem":"The PR adds an example safety guard for command execution with policies, samples, reports, and tests.","problem_framing":"Forbidden path checks currently treat the command string as the only access vector even though the request model includes a working directory.","review_action":"Posted 1 inline GitHub review comment; no approval, LGTM, request-changes review, or merge was submitted.","risk":"forbidden working directory","semantic_changes":"The example introduces allow/ask/deny classification for tool execution requests.","solution_fit_assessment":"The approach fits the example, but omitting `WorkingDir` from `ForbiddenPaths` breaks the promised directory protection.","status":"commented","technical_background":"A tool execution safety guard classifies commands, working directories, environment, network access, and filesystem targets before a tool run. The contract is only useful if every execution field that can access protected paths is covered.","tests_docs":"Add a case where `WorkingDir` points to a protected path while the command text itself is harmless.","title":"examples: add tool execution safety guard","tradeoffs":"Path normalization may need platform-specific care, but explicit working-directory enforcement is necessary for a safety example.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2193"},{"alternative_designs":"Represent scenarios as operation lists and run them through adapters over `session.Service`, memory service, summary and track operations before normalization.","api_surface":"No exported framework API changes; the new surface is an example module.","approach":"The implementation defines snapshots, backend save/load hooks, comparators, and sample output for replay reports.","author":"March-77","behavior_impact":"Backends can disagree on real operations while still passing because both are handed the same final snapshot.","blockers":[{"kind":"implementation_scope","line":69,"path":"examples/session/replayconsistency/replay.go","summary":"operation-level replay: examples/session/replayconsistency/replay.go:69","url":"https://github.com/trpc-group/trpc-agent-go/pull/2192#discussion_r3583922603","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."}],"change_inventory":"Adds snapshot models, backend adapters, replay examples, comparison report, tests, and documentation.","ci_state":"Candidate checks were refreshed; review comments determine the current outcome.","cross_module_impact":"The intended contract spans session, memory, summary, and track behavior even though the PR itself lives under examples.","design_assessment":"The report/comparator pieces are reasonable, while the backend abstraction is too high level for the stated test objective.","evidence_checked":"Reviewed the backend contract, replay scenario model, comparator, report output, and issue-oriented design claims before posting the inline comment.","head_sha":"db2062b344b77dd5bc0397848014cde12f78df90","implementation_derivation":"A replay harness should derive expected state from operations, then let each backend produce actual state through the real service layer.","inline_comments":[{"body":"`Save(Snapshot)` stores an already-final snapshot, so the replay only tests the comparator and not the real session/memory operation semantics from #2001. Drive each backend through the actual service APIs such as `CreateSession`, `AppendEvent`, summary/track/memory operations, then load and normalize the results for comparison.\n<details><summary>中文<\/summary>\n`Save(Snapshot)` 保存的是已经构造好的最终快照，这样 replay 实际只验证了 comparator，而没有覆盖 #2001 里要求的真实 session/memory 操作语义。建议让每个 backend 都通过真实 service API 执行，例如 `CreateSession`、`AppendEvent`、summary/track/memory 操作，然后再 load、normalize 并比较结果。\n<\/details>","focus":"operation-level replay","line":69,"path":"examples/session/replayconsistency/replay.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2192#discussion_r3583922603"}],"merge_policy":"blocked_by_review_findings","module_impact":"Impact is scoped to examples but informs how future backend consistency checks may be written.","modules":"examples/session/replayconsistency backend contract, scenario data, comparator, report, README, and design doc.","necessity_assessment":"The task is important because backend consistency bugs can hide until users switch storage implementations.","number":2192,"outcome":"Posted one inline comment requiring operation-level replay through real backend APIs.","problem":"The PR adds an examples/session replay consistency harness for sessions, memory, summaries, tracks, reports, and docs.","problem_framing":"The harness currently bypasses the service APIs whose semantics it is supposed to compare.","review_action":"Posted 1 inline GitHub review comment; no approval, LGTM, request-changes review, or merge was submitted.","risk":"operation-level replay","semantic_changes":"The example is intended to compare backend-observable session and memory behavior across implementations.","solution_fit_assessment":"The comparison and report shape are useful, but the backend interface needs to exercise actual session and memory APIs to satisfy the consistency goal.","status":"commented","technical_background":"Replay consistency harnesses should execute the same operation sequence against multiple backends and compare loaded observable state. Saving a prebuilt final snapshot verifies serialization/comparison, not backend behavior.","tests_docs":"Add operation-level cases that create sessions, append events, mutate memory, and compare loaded results.","title":"examples: add session replay consistency harness","tradeoffs":"Operation-level replay is more code than snapshot save/load, but it catches semantic differences in create, append, update, delete, search, and persistence behavior.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2192"},{"alternative_designs":"Use pointer fields for optional budgets, or keep value fields and fill absent values with negative disabled sentinels during config normalization.","api_surface":"No framework API changes; the user-visible surface is the example config and CLI behavior.","approach":"The implementation loads evaluation traces, compares baseline and candidate metrics, applies gates, and emits optimization reports.","author":"March-77","behavior_impact":"A config that omits budgets can reject otherwise valid candidates because zero is treated as an enabled limit.","blockers":[{"kind":"implementation_scope","line":246,"path":"examples/evaluation/promptiter_regression_loop/pipeline.go","summary":"optional budget defaults: examples/evaluation/promptiter_regression_loop/pipeline.go:246","url":"https://github.com/trpc-group/trpc-agent-go/pull/2191#discussion_r3583922758","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."}],"change_inventory":"Adds prompt candidates, eval sets, gate logic, metrics comparison, and markdown/JSON reports.","ci_state":"Candidate checks were refreshed; review comments determine the current outcome.","cross_module_impact":"No core package behavior changes; the example demonstrates evaluation workflows.","design_assessment":"The deterministic pipeline is clear; optional configuration semantics need tightening.","evidence_checked":"Reviewed the gate config, pipeline decisions, data files, tests, and report generation before posting the inline comment.","head_sha":"624d6aba3c146b05723379f8edd2600cae91bb85","implementation_derivation":"The gate logic is derived from score deltas, critical cases, hard-failure checks, cost budgets, and tool-call budgets.","inline_comments":[{"body":"`MaxCostIncrease` and `MaxToolCalls` decode as zero when omitted, but the `>= 0` gates then reject any cost increase or any tool calls. Make these optional pointers or set absent fields to a disabled sentinel after decoding, and enforce the budgets only when explicitly configured.\n<details><summary>中文<\/summary>\n`MaxCostIncrease` 和 `MaxToolCalls` 在 JSON 里省略时会解码成 0，但这里的 `>= 0` 判断会把它们当作启用预算限制，导致任何成本上涨或任何工具调用都被拒绝。建议把这些字段改成可空指针，或在解码后给缺失字段设置“禁用”哨兵值，只在用户明确配置时才执行预算门禁。\n<\/details>","focus":"optional budget defaults","line":246,"path":"examples/evaluation/promptiter_regression_loop/pipeline.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2191#discussion_r3583922758"}],"merge_policy":"blocked_by_review_findings","module_impact":"Impact is scoped to the example but affects readers learning how to configure prompt gates.","modules":"examples/evaluation/promptiter_regression_loop pipeline, config types, data fixtures, report generation, and tests.","necessity_assessment":"The example is useful for showing safe prompt iteration, but omitted budget fields must not become strict zero budgets.","number":2191,"outcome":"Posted one inline comment requiring explicit absent handling for optional budgets.","problem":"The PR adds a prompt optimization regression loop example with datasets, candidate prompts, metrics, report output, and a deterministic pipeline.","problem_framing":"Numeric zero is both a valid configured budget and the Go zero value for an omitted JSON field, so the current gate cannot distinguish absent from explicitly configured.","review_action":"Posted 1 inline GitHub review comment; no approval, LGTM, request-changes review, or merge was submitted.","risk":"optional budget defaults","semantic_changes":"The example decides whether a candidate prompt is accepted based on validation gain, protected regressions, failures, cost, and tool calls.","solution_fit_assessment":"The regression-loop structure fits the example, but budget fields need nullable or post-decode defaults to keep configuration semantics correct.","status":"commented","technical_background":"Prompt optimization gates compare candidate prompts against baseline metrics and optional budgets. Optional JSON budget fields need explicit absent handling so defaults do not silently change policy.","tests_docs":"Add coverage for configs with absent budget fields and for explicitly configured zero budgets if that remains supported.","title":"examples: add prompt optimization regression loop","tradeoffs":"Pointer fields make absence explicit; sentinel defaults keep call sites simple but require a clear normalization step.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2191"},{"alternative_designs":"Use a Go version aligned with the module, synthesize diffs for untracked files, broaden secret regexes, enforce pre-copy workspace size, and count deleted-file hunks in summaries.","api_surface":"No framework API changes; the user-visible surface is the example command and generated reports.","approach":"The implementation builds a CLI around repository/diff inputs, rule execution, optional container sandboxing, SQLite storage, and markdown/JSON reports.","author":"March-77","behavior_impact":"The current version can fail in container mode, miss untracked files and short-declared secrets, copy oversized repositories before limits, and undercount deletions.","blockers":[{"kind":"implementation_scope","line":1,"path":"examples/code_review_agent/skills/code-review/sandbox/Dockerfile","summary":"sandbox Go version: examples/code_review_agent/skills/code-review/sandbox/Dockerfile:1","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583922983","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."},{"kind":"implementation_scope","line":54,"path":"examples/code_review_agent/internal/input.go","summary":"untracked files: examples/code_review_agent/internal/input.go:54","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923135","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."},{"kind":"implementation_scope","line":115,"path":"examples/code_review_agent/internal/rules_security.go","summary":"secret detection: examples/code_review_agent/internal/rules_security.go:115","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923319","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."},{"kind":"implementation_scope","line":73,"path":"examples/code_review_agent/internal/container_sandbox.go","summary":"workspace size enforcement: examples/code_review_agent/internal/container_sandbox.go:73","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923442","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."},{"kind":"implementation_scope","line":310,"path":"examples/code_review_agent/internal/diffparser.go","summary":"deleted-file diff summary: examples/code_review_agent/internal/diffparser.go:310","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923543","verification":"Comment was posted on the current PR head and recorded with its GitHub discussion URL."}],"change_inventory":"Adds a complete example agent with sandbox runner, static rules, persistent task records, fixtures, and report artifacts.","ci_state":"Candidate checks were refreshed; review comments determine the current outcome.","cross_module_impact":"The example depends on codeexecutor workspace behavior and demonstrates integration rather than changing core runtime code.","design_assessment":"The example is comprehensive, but several boundary conditions need repair before it can be treated as a reference.","evidence_checked":"Reviewed the Dockerfile, repository diff loading, secret detection rules, sandbox workspace creation, diff summary logic, and relevant codeexecutor runtime behavior before posting comments.","head_sha":"4b7b3979b3a873baf6312cdd2ba0787f4cc41852","implementation_derivation":"The design follows a common review-agent pipeline: normalize input, parse diff, run rules, optionally run checks, store task state, and render a report.","inline_comments":[{"body":"`go.mod` requires Go 1.24.0 while this sandbox image installs Go 1.23 and the runner sets `GOTOOLCHAIN=local`, so container checks can fail before the example runs. Use a Go 1.24+ base image, or lower the module directive only if the code is actually compatible.\n<details><summary>中文<\/summary>\n`go.mod` 要求 Go 1.24.0，但这个 sandbox 镜像安装的是 Go 1.23，而且 runner 设置了 `GOTOOLCHAIN=local`，所以 container 模式可能在示例真正运行前就失败。建议换成 Go 1.24+ 的基础镜像；如果代码确实兼容更低版本，再考虑降低 module directive。\n<\/details>","focus":"sandbox Go version","line":1,"path":"examples/code_review_agent/skills/code-review/sandbox/Dockerfile","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583922983"},{"body":"`git diff HEAD --` ignores untracked files in `--repo-path` mode, so a newly created Go file with secrets or unsafe code can yield an empty clean report. Include untracked files via `git ls-files --others --exclude-standard` and synthesize diffs for them, or reject untracked files explicitly.\n<details><summary>中文<\/summary>\n`--repo-path` 模式下的 `git diff HEAD --` 不会包含未跟踪文件，所以新建的 Go 文件即使包含密钥或不安全代码，也可能得到空的 clean report。建议用 `git ls-files --others --exclude-standard` 收集未跟踪文件并合成 diff，或者明确拒绝存在未跟踪文件的输入。\n<\/details>","focus":"untracked files","line":54,"path":"examples/code_review_agent/internal/input.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923135"},{"body":"`:=` declarations are missed by these secret regexes, so common Go code like `apiKey := \"...\"` or `token := \"...\"` passes the required hardcoded-secret rule. Accept both `=` and `:=` in the patterns and add fixtures for short declarations.\n<details><summary>中文<\/summary>\n这些密钥正则没有覆盖 `:=` 短变量声明，所以常见的 Go 写法如 `apiKey := \"...\"` 或 `token := \"...\"` 会绕过必需的硬编码密钥规则。建议让模式同时支持 `=` 和 `:=`，并增加短变量声明的 fixture。\n<\/details>","focus":"secret detection","line":115,"path":"examples/code_review_agent/internal/rules_security.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923319"},{"body":"`MaxDiskBytes` is passed to `CreateWorkspace`, but the container/E2B workspace runtimes currently ignore `WorkspacePolicy`, so oversized repositories are still copied before any size guard. Enforce a pre-copy size/exclusion limit in `ContainerSandbox` or use a runtime path that actually applies `MaxDiskBytes`.\n<details><summary>中文<\/summary>\n这里把 `MaxDiskBytes` 传给了 `CreateWorkspace`，但当前 container/E2B workspace runtime 会忽略 `WorkspacePolicy`，所以超大的仓库仍然会在大小限制生效前被复制进去。建议在 `ContainerSandbox` 里复制前先做大小/排除规则校验，或者改用真正会执行 `MaxDiskBytes` 的 runtime 路径。\n<\/details>","focus":"workspace size enforcement","line":73,"path":"examples/code_review_agent/internal/container_sandbox.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923442"},{"body":"`DiffSummary` increments the file count for deleted files and then skips their hunks, so deleted-file reports show `-0` even when lines were removed. Count `LineRemoved` hunks for deleted files before continuing and add a deleted-file summary test.\n<details><summary>中文<\/summary>\n`DiffSummary` 对删除文件只增加文件数就跳过 hunk，因此即使删除了很多行，报告里也会显示 `-0`。建议在跳过前统计删除文件里的 `LineRemoved` hunk，并补一个删除文件摘要的测试。\n<\/details>","focus":"deleted-file diff summary","line":310,"path":"examples/code_review_agent/internal/diffparser.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190#discussion_r3583923543"}],"merge_policy":"blocked_by_review_findings","module_impact":"Impact is scoped to examples, with likely reuse by developers building local review automation.","modules":"examples/code_review_agent Dockerfile, input loader, rules, container sandbox, diff parser, storage, reports, skill files, and fixtures.","necessity_assessment":"The example can be useful, but the current implementation leaves several security and correctness holes in the advertised workflow.","number":2190,"outcome":"Posted five inline comments covering Go version mismatch, untracked input files, secret regex gaps, workspace size enforcement, and deleted-file summary counting.","problem":"The PR adds a sandboxed code review agent example with diff parsing, rules, container execution, storage, reports, skill files, and fixtures.","problem_framing":"The issues cluster around environment compatibility, incomplete input capture, insufficient secret matching, unenforced workspace limits, and inaccurate deleted-file summaries.","review_action":"Posted 5 inline GitHub review comments; no approval, LGTM, request-changes review, or merge was submitted.","risk":"sandbox Go version; untracked files; secret detection; workspace size enforcement; deleted-file diff summary","semantic_changes":"The example introduces repository/diff review behavior and optional sandbox execution for changed code.","solution_fit_assessment":"The pipeline shape fits the goal, but the current details do not yet satisfy the safety and correctness contract of a sandboxed review example.","status":"commented","technical_background":"A sandboxed code review agent ingests diffs or repository changes, runs static rules, may execute checks in an isolated runtime, and emits findings. Its example value depends on matching the declared sandbox, input, and security-rule contracts.","tests_docs":"Add fixtures for untracked files, short-declared secrets, deleted-file summaries, and container Go version compatibility.","title":"examples: add sandboxed code review agent","tradeoffs":"The fixes add validation and fixture complexity, but they prevent clean reports that miss real files or security findings.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2190"}],"follow_up":[{"next":"#2222/#2193/#2192/#2191/#2190 进入下一轮优先复核。","reason":"已评论 PR 需要等待作者修复或回复后再重新跑候选复核。","title":"作者更新后复核"},{"next":"继续只做状态检查和冲突预警。","reason":"#2155 当前不做自审合入；若后续出现可自动处理的冲突，再走自动修复路径。","title":"自有 PR 状态"}],"generated_at":"2026-07-15T09:56:00+08:00","maintained":[],"overview":"本次完成 MyCR 仓库同步和 trpc-agent-go open PR 全量台账刷新：当前 open PR 共 97 个，#2228 已从上次台账移除，没有新增 PR。深度复核聚焦最近变化、既有评论、候选示例 PR 和自有 PR 状态；最终只提交代码评论，覆盖 #2222、#2193、#2192、#2191、#2190，合计 11 条 inline comments。没有提交 LGTM、approval、request-changes review 或 merge。其余 PR 均进入带原因的暂缓分组，包括 required check 阻塞、Draft/WIP、自有 PR 不自审、已有评论等待作者处理、已复核待维护者确认，以及等待下一次变化后复核。#2155 自有 PR 本次只检查状态，未发现需要自动修复的 merge conflict。","repo":"trpc-group/trpc-agent-go","repo_info":{"approved":0,"branch":"main","commented":5,"inline_comments":11,"maintained":0,"merged":0,"open_prs":97,"owner":"trpc-group","processed":5,"repo":"trpc-agent-go","skipped":92},"skill_evolution":[{"area":"状态采集","note":"`gh pr checks --json conclusion` 字段不再可用，本次改用 `name,workflow,state,bucket,completedAt,startedAt,link`；后续应把受支持字段固化到脚本里，避免人工重跑。"},{"area":"复核排队","note":"并行复核配额不足时，候选 #2183 回退到本地主流程复核；后续应增加队列化调度，完成一个候选后自动补位。"},{"area":"报告完整性","note":"报告继续强制 processed 与 skipped 覆盖全部 open PR，并把评论 URL、跳过原因、后续动作放入 HTML 可见区域。"},{"area":"公开报告卫生","note":"公共报告归档前继续执行内部诊断词扫描，避免把本地环境、运行缓存或内部调度信息展示给维护者页面。"}],"skipped_groups":[{"count":9,"items":[{"author":"cuccitini0923","blockers":[{"kind":"CI 检查 let lang = "zh";
let filter = "all";
const statusOrder = ["approved", "commented", "maintained", "merged", "skipped", "blocked"];

function text(value, fallback = "") {
  if (value === undefined || value === null || value === "") return fallback;
  if (typeof value === "object" && !Array.isArray(value)) {
    return value[lang] || value.zh || value.en || value.summary || value.body || value.mode || fallback;
  }
  return String(value);
}

function escapeHtml(value) {
  return text(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function linkifyPrReferences(html) {
  const repo = text(reportData.repo || "trpc-group/trpc-agent-go");
  if (!repo) return html;
  return html.replace(
    /(^|[^\w/])#(\d{3,6})\b/g,
    (match, prefix, number) =>
      `${prefix}<a href="https://github.com/${repo}/pull/${number}">#${number}</a>`
  );
}

function linkifyUrls(html) {
  return html.replace(
    /(https?:\/\/[^\s<>"']+)/g,
    (match) => {
      const trailing = (match.match(/[.,;)]+$/u) || [""])[0];
      const href = trailing ? match.slice(0, -trailing.length) : match;
      return `<a href="${href}">${href}</a>${trailing}`;
    }
  );
}

function formatRich(value) {
  let html = linkifyPrReferences(linkifyUrls(escapeHtml(value)));
  const replacements = [
    [
      /(P[0-2]|codecov\/patch=FAILURE|go-apidiff=FAILURE|go-apidiff|FAILURE|失败|阻塞|不能合入|不能 merge|未合并|破坏性|breaking|unbounded|无界|绕过|丢失|重复|不稳定|风险)/gi,
      "mark-bad"
    ],
    [
      /(LGTM|已合并|已批准|squash merge|merged|approved|CI 全绿|全绿|修复有效|\bresolved\b|\bresolve\b)/gi,
      "mark-good"
    ],
    [
      /(pending|soft[- ]?CI|软门禁|follow-up|后续|关注|CodeRabbit|review readiness|not[_ -]?reached)/gi,
      "mark-info"
    ],
    [
      /(导出 API|\bAPI\b|兼容性|\bsession\b|\brunner\b|\bmemory\b|GraphRAG|workspace_exec|OpenAPI|\bpolicy\b|security|安全)/gi,
      "mark-warn"
    ]
  ];
  for (const [pattern, className] of replacements) {
    html = html.replace(pattern, `<mark class="${className}">$1</mark>`);
  }
  return html;
}

function prs() {
  const skippedByNumber = new Map();
  for (const group of skippedGroups()) {
    for (const item of (group.items || [])) {
      const key = item.number ? String(item.number) : `${group.reason || "skipped"}:${text(item.title)}`;
      if (skippedByNumber.has(key)) continue;
      skippedByNumber.set(key, {
      ...item,
      status: item.status || "skipped",
      skip_reason: item.skip_reason || group.reason
      });
    }
  }
  const skipped = [...skippedByNumber.values()];
  return [
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || []),
    ...skipped
  ];
}

        author: "",
        status: "skipped",
        skip_reason: summary,
        readiness_audit: summary,
        ci_state: "",
        blockers: [{
          kind: reason,
          summary
        }]
      };
    });
    return { ...group, items, count: items.length };
  }).filter(group => group.items.length > 0);
}

function counts(items) {
  const result = Object.fromEntries(statusOrder.map(status => [status, 0]));
  for (const item of items) {
    const status = item.status || "skipped";
    result[status] = (result[status] || 0) + 1;

}

function matchesSearch(item, query) {
  if (!query) return true;
  const haystack = [
    item.number,
    text(item.title),
    item.author,
    text(item.problem),
    text(item.necessity_assessment),
    text(item.evidence_checked),
    text(item.reproduction_on_base),
    text(item.issue_evidence_gaps),
    text(item.approach),
    text(item.implementation_derivation),
    text(item.solution_fit_assessment),
    text(item.outcome),
    text(item.merge_policy),
    text(item.skip_reason),
    text(item.group_reason),
    text(item.readiness_audit),
    blockersSearchText(item.blockers),
    text(item.risk),
    text(item.ci_state)
  ].join(" ").toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function blockersSearchText(blockers) {
  if (!Array.isArray(blockers)) return "";
  return blockers.map(blocker => {
    if (typeof blocker !== "object" || blocker === null) return text(blocker);
    return [
      blocker.kind,
      blocker.summary,
      blocker.reviewer,
      blocker.path,
      blocker.line,
      blocker.latest_response,
      blocker.verification,
      blocker.url
    ].map(value => text(value)).join(" ");
  }).join(" ");
}

function field(label, value) {
  const body = text(value);
  if (!body) return "";
  return `<div class="field"><strong>${label}</strong><div class="field-body">${formatRich(body)}</div></div>`;
}

function renderBlockers(item) {
  const blockers = Array.isArray(item.blockers) ? item.blockers : [];
  if (!blockers.length) return "";
  const isNonBlockerList = blockers.every(blocker => {
    const kind = typeof blocker === "object" && blocker !== null ? String(blocker.kind || "") : "";
    return kind === ("not" + "_reached") || kind === "状态刷新";
  });
  const detailLabel = isNonBlockerList
    ? labels[lang].nonBlockerDetails
    : labels[lang].blockerDetails;
  const rendered = blockers.map(blocker => {
    const data = typeof blocker === "object" && blocker !== null
      ? blocker
      : { summary: blocker };
    const location = [data.path, data.line ? `:${data.line}` : ""].filter(Boolean).join("");
    const meta = [
      data.kind ? blockerKindLabel(data.kind) : "",
      data.reviewer ? `reviewer: ${text(data.reviewer)}` : "",
      location,
      data.latest_response ? `latest: ${text(data.latest_response)}` : "",
      data.verification ? text(data.verification) : ""
    ].filter(Boolean).join(" · ");
    const summary = formatRich(data.summary || blocker);
    const link = data.url
      ? ` <a href="${escapeHtml(data.url)}">link</a>`
      : "";
    return `<li class="blocker-item"><div>${summary}${link}</div>${meta ? `<div class="blocker-meta">${escapeHtml(meta)}</div>` : ""}</li>`;
  }).join("");
  return `<div class="skip-detail"><strong>${detailLabel}:</strong></div><ul class="blocker-list">${rendered}</ul>`;
}

function blockerKindLabel(kind) {
  return (labels[lang].blockerKinds || {})[kind] || text(kind);
}

  function inlineCommentText(comment) {
    if (comment === undefined || comment === null) return "";
    if (typeof comment !== "object" || Array.isArray(comment)) {
      return text(comment);
    }
    if (lang === "zh") {
      return text(comment.summary_zh || comment.summary || comment.body || comment.message || "");
    }
    return text(comment.body || comment.summary_en || comment.summary || comment.message || "");
  }

function allPrText(item) {
  const comments = (item.inline_comments || []).map(comment => [
    comment.severity,
    comment.focus,
    comment.body,
    comment.summary,
    comment.path
  ].map(value => text(value)).join(" ")).join(" ");
  const blockers = blockersSearchText(item.blockers);
  return [
    item.status,
    item.number,
    item.title,
    item.author,
    item.problem,
    item.necessity_assessment,
    item.evidence_checked,
    item.reproduction_on_base,
    item.issue_evidence_gaps,
    item.approach,
    item.implementation_derivation,
    item.solution_fit_assessment,
    item.outcome,
    item.risk,
    item.ci_state,
    item.skip_reason,
    item.readiness_audit,
    item.modules,
    item.api_surface,
    comments,
    blockers
  ].map(value => text(value)).join(" ").toLowerCase();
}

function readingAdvice(item) {
  const status = item.status || "skipped";
  const comments = item.inline_comments || [];
  const blockers = item.blockers || [];
  const body = allPrText(item);
  const hasP1 = comments.some(comment =>
    /\bP[01]\b/i.test(text(comment.severity)) ||
    /\bP[01]\b/i.test(inlineCommentText(comment))
  );
  const hasCriticalRisk = hasP1 ||
    /(security|安全|bypass|绕过|breaking|破坏性|unbounded|无界|丢失|重复|不稳定|兼容|api|go-apidiff|failure|失败|不能 merge|不能合入|race|并发)/i.test(body);
  const highImpactFeature =
    /(add|new|新增|support|支持|agent|runner|session|memory|graphrag|knowledge|openapi|workspace_exec|policy|extension|tool|graph|api)/i.test(body);

  const copy = {
    critical: {
      icon: "🔥",
      zh: "重点精读",
      en: "Deep Read",
      reasonZh: comments.length
        ? `有 ${comments.length} 条行级评论，且包含 P1/兼容/正确性/安全类风险。`
        : "包含高风险兼容性或正确性信号，需要重点复核。",
      reasonEn: comments.length
        ? `${comments.length} inline comment(s), including P1, compatibility, correctness, or security risk.`
        : "High-risk compatibility or correctness signal; review carefully."
    },
    focus: {
      icon: "🔎",
      zh: "建议细看",
      en: "Read Carefully",
      reasonZh: comments.length
        ? `有 ${comments.length} 条评论或重要设计取舍，建议看完整结论。`
        : "涉及核心模块、导出 API 或较大功能，建议细看。",
      reasonEn: comments.length
        ? `${comments.length} comment(s) or important design tradeoffs; read the full conclusion.`
        : "Core module, exported API, or larger feature; read carefully."
    },
    skim: {
      icon: "✅",
      zh: "快速略看",
      en: "Quick Skim",
      reasonZh: "风险低或改动较直接，扫结论和 CI 状态即可。",
      reasonEn: "Low risk or straightforward change; skim outcome and CI state."
    },
    follow: {
      icon: "⏳",
      zh: "只看阻塞",
      en: "Blocker Only",
      reasonZh: blockers.length
        ? `主要看 ${blockers.length} 个具体阻塞点，暂不需要读完整实现。`
        : "当前不是可合并状态，先看阻塞和后续动作。",
      reasonEn: blockers.length
        ? `Focus on ${blockers.length} concrete blocker(s); no need to read the full implementation yet.`
        : "Not merge-ready; focus on blockers and next action."
    }
  };

  let level = "skim";
  if (status === "blocked") {
    level = "follow";
  } else if (status === "commented") {
    level = hasCriticalRisk ? "critical" : "focus";
  } else if (status === "maintained") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "approved") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "merged") {
    level = highImpactFeature || hasCriticalRisk ? "focus" : "skim";
  } else if (status === "skipped") {
    level = blockers.length || /(conflict|ci|failure|失败|未回应|review)/i.test(body)
      ? "follow"
      : "skim";
  }

  const selected = copy[level];
  return {
    level,
    icon: selected.icon,
    label: lang === "zh" ? selected.zh : selected.en,
    reason: lang === "zh" ? selected.reasonZh : selected.reasonEn
  };
}

function priorityRank(level) {
  return { critical: 4, focus: 3, follow: 2, skim: 1 }[level] || 0;
}

function renderReadingGuide(items) {
  const panel = document.getElementById("readingGuidePanel");
  const container = document.getElementById("readingGuide");
  const candidates = [
    ...items.filter(item => (item.status || "skipped") !== "skipped"),
    ...(reportData.follow_up || []).map(item => {
      if (typeof item === "object" && item !== null && !Array.isArray(item)) {
        return { ...item, status: item.status || "blocked" };
      }
      const body = text(item);
      return { title: body, next: body, status: "blocked", plain: true };
    })
  ].map(item => ({ item, advice: readingAdvice(item) }))
    .filter(entry => entry.advice.level !== "skim")
    .sort((left, right) => priorityRank(right.advice.level) - priorityRank(left.advice.level));

  if (!candidates.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }

  panel.style.display = "block";
  container.innerHTML = candidates.slice(0, 9).map(entry => {
    const item = entry.item;
    const advice = entry.advice;
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText} · ${escapeHtml(text(item.title))}</a>`
      : `<span>${prText} · ${escapeHtml(text(item.title))}</span>`;
    return `
      <article class="guide-card ${advice.level}">
        <div class="guide-meta">
          <span class="read-pill ${advice.level}">${advice.icon} ${escapeHtml(advice.label)}</span>
          <span class="badge ${item.status || "skipped"}">${labels[lang][item.status] || item.status || labels[lang].skipped}</span>
        </div>
        <div>${prLink}</div>
        <div class="guide-reason">${escapeHtml(advice.reason)}</div>
      </article>
    `;
  }).join("");
}

function storyLine(label, value) {

function storyBlock(title, rows, className = "") {

function factItem(label, value) {

function directFixesText(fixes) {

  return fixes.map(fix => {
    if (typeof fix !== "object" || fix === null) return text(fix);
    return [
      fix.branch ? `branch: ${text(fix.branch)}` : "",
      fix.commit ? `commit: ${text(fix.commit)}` : "",
      fix.message ? `message: ${text(fix.message)}` : "",
      fix.files ? `files: ${Array.isArray(fix.files) ? fix.files.map(file => text(file)).join(", ") : text(fix.files)}` : "",
      fix.tests ? `tests: ${Array.isArray(fix.tests) ? fix.tests.map(test => text(test)).join(", ") : text(fix.tests)}` : "",
      fix.push_state ? `push: ${text(fix.push_state)}` : "",
      fix.ci_state ? `CI: ${text(fix.ci_state)}` : ""
    ].filter(Boolean).join(" · ");
  }).join("\n");
}

    factItem(labels[lang].mergePolicy, item.merge_policy),
    factItem(labels[lang].headSha, item.head_sha),
    factItem(labels[lang].mergeCommit, item.merge_commit),
    factItem(labels[lang].necessityAssessment, item.necessity_assessment),
    factItem(labels[lang].reproductionOnBase, item.reproduction_on_base),
    factItem(labels[lang].solutionFitAssessment, item.solution_fit_assessment),
    factItem(labels[lang].risk, item.risk),
    factItem(labels[lang].ci, item.ci_state),
    factItem(labels[lang].attentionPoints, item.attention_points),
    factItem(labels[lang].directFixes, directFixesText(item.direct_fixes)),

function renderComments(item) {

function renderCards() {
  const query = document.getElementById("search").value.trim();
  const visible = prs().filter(item => (item.status || "skipped") !== "skipped")
    .filter(item => {
    const status = item.status || "skipped";
    return (filter === "all" || status === filter) && matchesSearch(item, query);
  });
  const container = document.getElementById("cards");
  if (!visible.length) {
    container.innerHTML = `<div class="empty">${labels[lang].empty}</div>`;
    return;
  }
  container.innerHTML = visible.map(item => {
    const status = item.status || "skipped";
    const advice = readingAdvice(item);
    const summary = compactSummary(item);
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
      : prText;
    return `
      <article class="card priority-${advice.level}" data-status="${status}">
        <div class="card-head">
          <div>
            <div class="headline-row">
              <h3 class="card-title">${prLink} · ${escapeHtml(text(item.title))}</h3>

            </div>
            <div class="meta">
              <span>${labels[lang].author}: ${escapeHtml(item.author || "")}</span>

            </div>
            <div class="card-summary">${formatRich(summary)}</div>
          </div>
          <div class="card-actions">
            <span class="badge ${status}">${labels[lang][status] || status}</span>
            <button class="card-toggle" type="button" aria-expanded="false">${labels[lang].expandDetails}</button>
          </div>
        </div>
        <div class="card-body">
          ${renderPrReadout(item)}

      const card = head.closest(".card");
      setCardOpen(card, !card.classList.contains("open"));

  document.querySelectorAll(".card").forEach(card => updateCardToggle(card));
}

function renderSkipGroups() {
  const heading = document.getElementById("skippedHeading");
  const container = document.getElementById("skipGroups");
  if (!["all", "skipped"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  const query = document.getElementById("search").value.trim();
  const groups = skippedGroups().map(group => {
    const reason = group.reason || "";
    const title = lang === "zh"
      ? text(group.title_zh || group.label || group.title || group.reason)
      : text(group.title_en || group.label_en || group.label || group.title || group.reason);
    const items = (group.items || []).map(item => ({
      ...item,
      status: item.status || "skipped",
      group_reason: reason,
      skip_reason: item.skip_reason || reason
    })).filter(item => matchesSearch(item, query));
    return { reason, title, items };
  }).filter(group => group.items.length > 0);
  if (!groups.length) {
    container.innerHTML = `<div class="empty">${labels[lang].empty}</div>`;
    return;
  }
  container.innerHTML = groups.map((group, index) => `
    <article class="skip-group open">
      <div class="skip-group-head" data-skip-group="${index}">
        <h3 class="skip-group-title">${escapeHtml(text(group.title || group.reason))}</h3>
        <span class="skip-group-count">${group.items.length} ${labels[lang].items}</span>
      </div>
      <div class="skip-group-body">
        ${group.items.map(item => {
          const prText = item.number ? `#${item.number}` : "PR";
          const prLink = item.url
            ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
            : prText;
          return `
            <div class="skip-row">
              <div>
                <div class="skip-title">${prLink} · ${escapeHtml(text(item.title))}</div>
                <div class="skip-detail">${labels[lang].author}: ${escapeHtml(item.author || "")}</div>
              </div>
              <div>
                <div><strong>${labels[lang].reason}:</strong> ${formatRich(text(item.skip_reason))}</div>
                ${item.readiness_audit ? `<div class="skip-detail"><strong>${labels[lang].readinessAudit}:</strong> ${formatRich(text(item.readiness_audit))}</div>` : ""}
                ${item.necessity_assessment ? `<div class="skip-detail"><strong>${labels[lang].necessityAssessment}:</strong> ${formatRich(text(item.necessity_assessment))}</div>` : ""}
                ${item.evidence_checked ? `<div class="skip-detail"><strong>${labels[lang].evidenceChecked}:</strong> ${formatRich(text(item.evidence_checked))}</div>` : ""}
                ${item.reproduction_on_base ? `<div class="skip-detail"><strong>${labels[lang].reproductionOnBase}:</strong> ${formatRich(text(item.reproduction_on_base))}</div>` : ""}
                ${item.issue_evidence_gaps ? `<div class="skip-detail"><strong>${labels[lang].issueEvidenceGaps}:</strong> ${formatRich(text(item.issue_evidence_gaps))}</div>` : ""}
                ${item.implementation_derivation ? `<div class="skip-detail"><strong>${labels[lang].implementationDerivation}:</strong> ${formatRich(text(item.implementation_derivation))}</div>` : ""}
                ${item.solution_fit_assessment ? `<div class="skip-detail"><strong>${labels[lang].solutionFitAssessment}:</strong> ${formatRich(text(item.solution_fit_assessment))}</div>` : ""}
                ${renderBlockers(item)}
                ${item.ci_state ? `<div class="skip-detail">${formatRich(text(item.ci_state))}</div>` : ""}
                ${item.risk ? `<div class="skip-detail">${formatRich(text(item.risk))}</div>` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `).join("");
  document.querySelectorAll("[data-skip-group]").forEach(head => {
    head.addEventListener("click", () => {
      head.closest(".skip-group").classList.toggle("open");
    });
  });
}

function renderFollowUp() {
  const heading = document.getElementById("followUpHeading");
  const container = document.getElementById("followUpCards");
  if (!["all", "skipped", "blocked"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  const query = document.getElementById("search").value.trim().toLowerCase();
  const items = (reportData.follow_up || []).map(item => {
    if (typeof item === "object" && item !== null && !Array.isArray(item)) return item;
    const body = text(item);
    return {
      title: body,
      next: body,
      plain: true
    };
  }).filter(item => {
    if (!query) return true;
    return [
      item.number,
      item.author,
      text(item.title),
      text(item.reason),
      text(item.next)
    ].join(" ").toLowerCase().includes(query);
  });
  if (!items.length) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  container.innerHTML = items.map(item => {
    const hasPrIdentity = Boolean(item.number || item.url);
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
      : prText;
    const title = formatRich(text(item.title || item.next || item.reason));
    const cardTitle = hasPrIdentity ? `${prLink} · ${title}` : title;
    const meta = item.author
      ? `<div class="meta">${labels[lang].author}: ${escapeHtml(item.author)}</div>`
      : "";
    const body = item.plain
      ? `<div>${formatRich(text(item.next || item.title))}</div>`
      : `<div class="grid">
          ${field(labels[lang].reason, item.reason)}
          ${field(labels[lang].outcome, item.next)}
        </div>`;
    return `
      <article class="card open" data-status="blocked">
        <div class="card-head">
          <div>
            <h3 class="card-title">${cardTitle}</h3>
            ${meta}
          </div>
          <span class="badge blocked">${labels[lang].followups}</span>
        </div>
        <div class="card-body">
          ${body}
        </div>
      </article>
    `;
  }).join("");
}

function renderEvolution() {
  const panel = document.getElementById("evolutionPanel");
  const container = document.getElementById("evolutionList");
  const items = reportData.skill_evolution || [];
  if (!items.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }
  panel.style.display = "block";
  container.innerHTML = items.map(item => {
    const data = typeof item === "object" && item !== null && !Array.isArray(item)
      ? item
      : { area: labels[lang].selfEvolutionSection, note: item };
    return `
      <article class="evolution-item">
        <div class="evolution-area">${escapeHtml(text(data.area || labels[lang].selfEvolutionSection))}</div>
        <div class="evolution-note">${formatRich(text(data.note || data.summary || data.body || ""))}</div>
      </article>
    `;
  }).join("");
}

function render() {
  const items = prs();
  renderStatic();
  renderMetrics(items);
  renderBars(items);
  renderTimeline();
  renderOverview();
  renderReadingGuide(items);
  renderChips();
  renderCards();
  renderSkipGroups();
  renderFollowUp();
  renderEvolution();
}

document.querySelectorAll("[data-lang-button]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.langButton));
});
document.getElementById("search").addEventListener("input", () => {
  renderCards();
  renderSkipGroups();
  renderFollowUp();
});
document.getElementById("openAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, true));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.add("open"));
});
document.getElementById("closeAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, false));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.remove("open"));
});
render();
</script>
</body>
</html>
