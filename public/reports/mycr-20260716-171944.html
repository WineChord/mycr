.card[data-status="skipped"] .card-head { border-left-color: var(--info); }
.card[data-status="blocked"] .card-head { border-left-color: var(--bad); }
.card.priority-critical .card-head {
  background: linear-gradient(180deg, #fff7f8, #fff);
}
.card.priority-focus .card-head {
  background: linear-gradient(180deg, #fffbeb, #fff);
}
.card.priority-follow .card-head {
  background: linear-gradient(180deg, #eff6ff, #fff);
}
.card-title {
  font-size: 16px;
  line-height: 1.42;
}
.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 7px;
}
.badge {
  gap: 7px;
  min-width: 0;
  padding: 6px 11px;
  text-transform: none;
  white-space: nowrap;
}
.card-summary {
  color: #526173;
  margin-top: 9px;
}
.badge::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.card-body {
  background: #fff;
  padding: 0 18px 18px;
}
.grid {
  grid-template-columns: 1fr;
  gap: 10px;
}
.field {
  background: #fbfcfe;
  border-color: #e6ecf3;
  padding: 13px 14px;
}
.field strong {
  color: #536175;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: uppercase;
}
.field-body {
  color: #1f2937;
  line-height: 1.62;
}
.comment {
  background: #fff8ed;
  border-left-color: var(--accent-2);
  color: #1f2937;
}
.comment-head {
  color: #1f2937;
}
.pr-readout {
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}
.story-block {
  border-top-color: #e2e8f0;
}
.story-block.hero-block {
  background: linear-gradient(180deg, #fbfffe, #f7fbfa);
  border-color: #d5e7e4;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
}
.story-block h4,
.review-rail h4,
.comments-panel h4 {
  font-size: 13px;
  font-weight: 900;
}
.story-line {
  grid-template-columns: 116px minmax(0, 1fr);
  border-top-color: #e9eef5;
}
.story-label {
  color: #607086;
}
.review-rail {
  border: 1px solid #e3eaf2;
  border-radius: 8px;
  padding: 14px;
  background: #fbfcfe;
}
.review-rail .fact-list {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.fact {
  border-top-color: #e8eef5;
}
.comments-panel {
  border-top-color: #e2e8f0;
}
.comment-list {
  gap: 12px;
}
.skip-group {
  box-shadow: var(--shadow);
}
.skip-group-head {
  align-items: center;
  background: linear-gradient(180deg, #fff, #fbfcfe);
}
.skip-row {
  grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.85fr);
}
.blocker-item {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
}
.empty {
  background: #fff;
  box-shadow: var(--shadow);
}
@media (max-width: 840px) {
  .topbar, .card-head { grid-template-columns: 1fr; display: grid; }
  .card-actions { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .dashboard, .grid, .metrics { grid-template-columns: 1fr; }
  .guide-grid { grid-template-columns: 1fr; }
  .headline-row { align-items: flex-start; flex-direction: column; }
  .pr-readout { grid-template-columns: 1fr; }
  .review-rail { position: static; }
  .story-line { grid-template-columns: 1fr; gap: 4px; }
  .timeline-item { grid-template-columns: 1fr; }
  .controls { position: static; }
  .utilities { width: 100%; margin-left: 0; }
  .utility-button { flex: 1 1 auto; }
  .skip-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1 data-i18n="title">MyCR 审核报告</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="toggle" aria-label="Language">
      <button type="button" data-lang-button="zh" class="active">中文</button>
      <button type="button" data-lang-button="en">EN</button>
    </div>
  </div>
  <section class="metrics" id="metrics"></section>
  <section class="dashboard">
    <div class="panel">
      <h2 data-i18n="statusDistribution">状态分布</h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="timeline">执行时间线</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
  <section class="panel" id="overviewPanel" style="display: none; margin-top: 16px;">
    <h2 data-i18n="overviewSection">整体摘要</h2>
    <div class="overview-content" id="overviewContent"></div>
  </section>
  <section class="panel reading-guide" id="readingGuidePanel" style="display: none;">
    <div class="guide-head">
      <h2 data-i18n="readingGuide">阅读建议</h2>
      <span data-i18n="readingGuideHint">先看高风险和高影响 PR</span>
    </div>
    <div class="guide-grid" id="readingGuide"></div>
  </section>
  <section class="controls">
    <input class="search" id="search" type="search">
    <div class="chips" id="chips"></div>
    <div class="utilities">
      <button type="button" class="utility-button" id="openAll"></button>
      <button type="button" class="utility-button" id="closeAll"></button>
    </div>
  </section>
  <section class="section-heading">
    <h2 data-i18n="reviewedSection">已处理 PR</h2>
    <div class="hint" data-i18n="reviewedHint">点击卡片查看细节</div>
  </section>
  <main class="cards" id="cards"></main>
  <section class="section-heading" id="skippedHeading">
    <h2 data-i18n="skippedGroups">未审核 PR 分类</h2>
    <div class="hint" data-i18n="skippedHint">按排除原因分组</div>
  </section>
  <section class="skip-groups" id="skipGroups"></section>
  <section class="section-heading" id="followUpHeading">
    <h2 data-i18n="followUpSection">后续关注</h2>
    <div class="hint" data-i18n="followUpHint">接近可处理但仍有阻塞</div>
  </section>
  <section class="cards" id="followUpCards"></section>
  <section class="panel" id="evolutionPanel" style="display: none; margin-top: 18px;">
    <h2 data-i18n="selfEvolutionSection">自进化记录</h2>
    <div class="evolution-list" id="evolutionList"></div>
  </section>
  <div class="footer" id="footer"></div>
</div>

const reportData = {"approved":[],"blocked":[],"commented":[{"alternative_designs":"Use pointer booleans or explicit presence tracking for YAML overrides, and regenerate examples through a single checked command that also updates container-smoke outputs.","api_surface":"Example CLI/config behavior and committed output contract; no core library API change.","approach":"The PR extends the example agent with config loading, model review hooks, and report artifacts for a skills-driven code review workflow.","attention_points":["examples/skills_code_review_agent/cmd/review-agent/main.go:136 YAML rule_only default flips to model-backed review","examples/skills_code_review_agent/output/review_report.json:136 sample report outputs are stale"],"author":"xyxhhhhh","behavior_impact":"Users running the example from YAML can see unexpected model setup failures, and readers comparing reports see mismatched artifacts.","change_inventory":"Adds a skills code-review example with configuration, report output, and sample artifacts.","ci_state":"Current effective checks refreshed: 162 checks, non-green=0.","cross_module_impact":"Docs and contributor examples inherit these defaults and artifacts as the reference workflow.","design_assessment":"The design is workable once defaults and sample artifacts are made deterministic.","evidence_checked":"Current PR head b854a8a37cffa75009737f73df3c06aa13c856c6, changed files, refreshed checks where available, existing review comments, and the current diff for every posted line.","head_sha":"b854a8a37cffa75009737f73df3c06aa13c856c6","implementation_derivation":"The affected paths sit at the command config boundary and committed output boundary, so stale defaults or artifacts directly change how new users run and validate the example.","inline_comments":[{"body":"Omitting `model.rule_only` from YAML currently flips the config to model-backed review because the unmarshaled bool defaults to `false`. Preserve the CLI default (`rule_only=true`) unless YAML explicitly sets this field, otherwise minimal configs can unexpectedly call a real model or report an LLM setup failure.\n\n<details><summary>中文<\/summary>\nYAML 里省略 `model.rule_only` 时，现在会因为 bool 零值变成 `false`，从而意外启用模型评审。请在 YAML 明确设置该字段时才覆盖 CLI 默认值（`rule_only=true`），否则最小配置可能会意外调用真实模型，或产生 LLM 配置失败的人工复核项。\n<\/details>","focus":"YAML rule_only default flips to model-backed review","line":136,"path":"examples/skills_code_review_agent/cmd/review-agent/main.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2243#discussion_r3594296951"},{"body":"This sample report is stale relative to the current renderer: the code and golden output now retain five artifacts and include `review_diagnostics.json` plus `review_report.zh.md`. Regenerate the tracked sample outputs, including the container-smoke samples, so the delivered reports match the documented output shape.\n\n<details><summary>中文<\/summary>\n这个示例报告已经和当前渲染逻辑不一致：代码和 golden 输出现在保留 5 个 artifact，并包含 `review_diagnostics.json` 与 `review_report.zh.md`。请重新生成已提交的示例输出，包括 container-smoke 样例，确保交付报告和文档描述一致。\n<\/details>","focus":"sample report outputs are stale","line":136,"path":"examples/skills_code_review_agent/output/review_report.json","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2243#discussion_r3594297594"}],"issue_evidence_gaps":"The review did not rerun the full example matrix locally; findings are derived from the current diff and committed output contract.","merge_policy":"blocked_by_review_findings","module_impact":"The example may call a model unexpectedly or show report shapes that the current renderer no longer emits.","modules":"examples/skills_code_review_agent command, config, output samples, and smoke artifacts","necessity_assessment":"useful_example_but_contract_must_match: the example is valuable, but defaults and artifacts need to be stable before maintainers can rely on it.","number":2243,"outcome":"2 inline comments posted on the current head.","problem":"The change adds useful configuration and reporting pieces, but the YAML default path can unexpectedly enable model-backed review, and the checked-in sample report no longer matches the renderer output.","problem_framing":"Example tooling must be copy-paste safe: omitting optional model fields should keep deterministic behavior, and committed artifacts should reflect the actual report shape.","reproduction_on_base":"Full runtime reproduction was not executed locally; the finding is grounded in current code paths and documented contracts.","review_action":"Posted 2 inline GitHub comments; no approval, request-changes review, LGTM label, or merge was submitted.","risk":"Maintainers should keep the PR unmerged until the posted findings are addressed and checks are clean.","root_cause":"A zero-value bool from YAML overwrites the CLI default, while generated output files were not regenerated after the artifact retention and bilingual report changes.","semantic_changes":"Minimal YAML config can currently change execution mode from rule-only to model-backed review.","solution_fit_assessment":"The overall direction fits the example, but the defaulting and artifact contract need correction before the example can be treated as reliable documentation.","status":"commented","technical_background":"The skills-based code-review example is meant to demonstrate a reproducible local review pipeline with rule-only defaults, optional model review, sandbox execution, and committed sample reports that contributors can trust as the documented contract.","tests_docs":"Needs a config-default regression and regenerated sample/container-smoke outputs.","title":"feat(examples): add skills-based code review agent","tradeoffs":"Preserving rule-only defaults keeps local runs deterministic, while still allowing model review when the config explicitly opts into it.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2243"},{"alternative_designs":"Set `IsPartial` on streamed transcript responses, introduce a transcript-only event kind, or filter these events in the Codex runner before session storage.","api_surface":"Codex agent event stream semantics; no exported Go API change.","approach":"The PR adds Codex JSONL event streaming and transcript-to-event conversion for assistant messages and other records.","attention_points":["agent/codex/transcript.go:302 streamed assistant messages can be persisted twice"],"author":"Flash-LHR","behavior_impact":"Users may see one assistant answer twice after replay/resume when streaming was enabled.","change_inventory":"Adds streamed JSONL handling for Codex assistant transcript events.","ci_state":"Current effective checks refreshed: 164 checks, non-green=1; examples: codecov/patch=FAILURE.","cross_module_impact":"Session services and downstream UIs that rely on persisted responses inherit the duplicate turn.","design_assessment":"The design fits the agent, but persistence semantics need one explicit boundary.","evidence_checked":"Current PR head 85429e4f4ac306f9831a5a4c1248d0838fc40bc6, changed files, refreshed checks where available, existing review comments, and the current diff for every posted line.","head_sha":"85429e4f4ac306f9831a5a4c1248d0838fc40bc6","implementation_derivation":"The issue follows directly from the event construction path and the runner predicate that persists any valid non-partial response.","inline_comments":[{"body":"Streamed `agent_message` events are emitted with `Done=false` but not marked partial, so `shouldPersistEvent` treats them as persistable assistant responses and then persists the final response again. Mark these transcript-stream events as partial, or otherwise exclude them from session persistence, to avoid duplicating assistant turns on replay/resume.\n\n<details><summary>中文<\/summary>\n流式 `agent_message` 事件现在只设置了 `Done=false`，但没有标记为 partial，因此 `shouldPersistEvent` 会把它当成可持久化的 assistant response，后面最终 response 又会再持久化一次。请把这类 transcript stream 事件标记为 partial，或用其他方式排除在 session 持久化之外，避免 replay/resume 时重复出现 assistant turn。\n<\/details>","focus":"streamed assistant messages can be persisted twice","line":302,"path":"agent/codex/transcript.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2238#discussion_r3594339213"}],"issue_evidence_gaps":"The review did not run an end-to-end Codex session; the finding is derived from the current transcript event and persistence predicates.","merge_policy":"blocked_by_review_findings","module_impact":"Resume and replay can show duplicated assistant content for streamed Codex sessions.","modules":"agent/codex transcript conversion and runner event persistence","necessity_assessment":"useful_streaming_feature_with_persistence_bug: event streaming is useful, but durable history must remain single-source.","number":2238,"outcome":"1 inline comment posted on the current head.","problem":"Streamed assistant transcript events are emitted as non-final responses without the partial marker, so session persistence can store them and then store the final assistant response again.","problem_framing":"Streaming should improve observability without changing the durable conversation history seen by resume or replay.","reproduction_on_base":"Full runtime reproduction was not executed locally; the finding is grounded in current code paths and documented contracts.","review_action":"Posted 1 inline GitHub comment; no approval, request-changes review, LGTM label, or merge was submitted.","risk":"Maintainers should keep the PR unmerged until the posted findings are addressed and checks are clean.","root_cause":"The transcript helper sets `Done=false` but leaves the response persistability flags indistinguishable from a normal assistant response for the runner persistence predicate.","semantic_changes":"Live assistant transcript messages can become durable assistant turns.","solution_fit_assessment":"Streaming transcript events is the right layer, but these live updates need to be marked partial or excluded from persistence.","status":"commented","technical_background":"The Codex agent streams transcript JSONL events into runner events while also persisting final model responses for session replay and resume. Partial-event marking separates live UI updates from durable assistant turns.","tests_docs":"Needs a persistence regression for streamed transcript plus final response.","title":"{agent/codex, docs}: stream Codex JSONL events","tradeoffs":"Marking stream events partial keeps persistence clean, while transcript-only events may require more UI handling.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2238"},{"alternative_designs":"Centralize allowlist merging once per case, feed the merged value to every comparison path, and choose either generic snapshot comparison or dedicated scoped-state comparison, not both.","api_surface":"Replay harness behavior and documentation commands for the nested module.","approach":"The PR introduces a replay consistency framework with backends, snapshots, golden traces, and README-driven integration commands.","attention_points":["session/replaytest/harness.go:423 golden trace comparison ignores per-case allowlist","session/replaytest/harness.go:744 parallel suite drops harness-level allowlist","session/replaytest/harness.go:371 scoped-state diffs are duplicated","session/replaytest/README-en.md:108 documented commands use the wrong module root"],"author":"BG0527","behavior_impact":"Parallel suites can disagree with serial suites, and README commands fail when run from the repository root.","change_inventory":"Adds replay cases, backend comparison logic, golden trace support, and contributor documentation.","ci_state":"Current effective checks refreshed: 164 checks, non-green=0.","cross_module_impact":"Storage/session backend maintainers may get noisy replay failures across Redis, SQL, and other adapters.","design_assessment":"The design is promising but currently produces avoidable false positives in common replay scenarios.","evidence_checked":"Current PR head 3ab9aaf4da8e33f33e0fc89af4531d537fc40731, changed files, refreshed checks where available, existing review comments, and the current diff for every posted line.","head_sha":"3ab9aaf4da8e33f33e0fc89af4531d537fc40731","implementation_derivation":"The failing behaviors all sit in shared harness code, so one inconsistent allowlist or duplicate comparison affects every backend case.","inline_comments":[{"body":"The golden-trace comparison ignores the merged `allowed` list and uses only `h.Allowed`, so per-case `AllowedDiffs` still fail when compared against a saved golden trace. Pass the merged allowlist here as well so golden regression checks behave the same as backend comparisons.\n\n<details><summary>中文<\/summary>\ngolden trace 对比这里没有使用已经合并好的 `allowed`，而是只用了 `h.Allowed`，所以 case 级别的 `AllowedDiffs` 在和已保存 golden trace 对比时仍会报错。这里也请传入合并后的 allowlist，保证 golden 回归检查和 backend 对比行为一致。\n<\/details>","focus":"golden trace comparison ignores per-case allowlist","line":423,"path":"session/replaytest/harness.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3594336535"},{"body":"Parallel `RunSuite` drops harness-level allowed diffs by assigning only `c.AllowedDiffs` to the per-case harness. Merge `h.Allowed` with the case overrides before constructing `caseHarness`, otherwise allowed global backend differences start failing only when the suite runs in parallel.\n\n<details><summary>中文<\/summary>\n并行 `RunSuite` 构造 per-case harness 时只赋了 `c.AllowedDiffs`，把 harness 级别的 allowlist 丢掉了。请先合并 `h.Allowed` 和 case 级覆盖再构造 `caseHarness`，否则全局允许的 backend 差异会只在并行执行路径下失败。\n<\/details>","focus":"parallel suite drops harness-level allowlist","line":744,"path":"session/replaytest/harness.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3594337298"},{"body":"`Compare` already walks the full `Snapshot`, including `app_state` and `user_state`, so the extra scoped-state comparison appends duplicate diffs for the same mismatches. Remove this second pass or exclude scoped state from the generic compare path so one real mismatch produces one report entry.\n\n<details><summary>中文<\/summary>\n`Compare` 已经会遍历完整 `Snapshot`，包括 `app_state` 和 `user_state`，这里再额外做 scoped-state comparison 会把同一个差异重复追加一次。请删除第二遍比较，或让通用比较路径排除 scoped state，保证一个真实差异只产生一条报告项。\n<\/details>","focus":"scoped-state diffs are duplicated","line":371,"path":"session/replaytest/harness.go","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3594337983"},{"body":"These docs still use the root-level `go test ./session/replaytest/` command, but this package is in its own Go module. Please switch the examples to `cd session/replaytest && go test ./...` or another module-local command so contributors can copy-paste them successfully.\n\n<details><summary>中文<\/summary>\n这里的文档仍然使用根目录下的 `go test ./session/replaytest/`，但这个 package 是独立 Go module。请改成 `cd session/replaytest && go test ./...`，或其他 module-local 命令，保证贡献者可以直接复制执行。\n<\/details>","focus":"documented commands use the wrong module root","line":108,"path":"session/replaytest/README-en.md","severity":"medium","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225#discussion_r3594338648"}],"issue_evidence_gaps":"The full backend matrix was not executed locally; findings come from current harness code and module layout.","merge_policy":"blocked_by_review_findings","module_impact":"Backend replay tests can fail for differences the case explicitly allowed.","modules":"session/replaytest harness, golden trace comparison, parallel suite runner, and README examples","necessity_assessment":"valuable_framework_with_false_positive_risk: replay testing is useful, but these inconsistencies would make maintainers distrust the results.","number":2225,"outcome":"4 inline comments posted on the current head.","problem":"Several comparison paths still ignore merged allowlists or duplicate scoped-state diffs, and the documented commands use the wrong Go module root.","problem_framing":"A replay framework is only useful if expected backend differences are consistently allowed and contributors can run the documented tests unchanged.","reproduction_on_base":"Full runtime reproduction was not executed locally; the finding is grounded in current code paths and documented contracts.","review_action":"Posted 4 inline GitHub comments; no approval, request-changes review, LGTM label, or merge was submitted.","risk":"Maintainers should keep the PR unmerged until the posted findings are addressed and checks are clean.","root_cause":"The harness merges allowlists for one comparison path but not golden or parallel paths, and it adds a second scoped-state comparison even though the generic snapshot compare already walks those fields.","semantic_changes":"Case-level allowed diffs can be ignored in golden or parallel paths, and one scoped-state mismatch can be reported twice.","solution_fit_assessment":"The framework direction is useful, but the comparison contract needs to be internally consistent before it can gate backend compatibility.","status":"commented","technical_background":"The session replay test harness compares behavior across storage backends and golden traces. Its allowlist, state snapshots, and documentation commands define whether backend differences are actionable or expected.","tests_docs":"Needs golden allowlist, parallel allowlist, scoped-state duplication, and module-local command coverage.","title":"session/replaytest: add replay consistency testing framework","tradeoffs":"Centralization reduces local flexibility but prevents path-specific false positives and duplicated report entries.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2225"},{"alternative_designs":"Record permission decisions only for real planned commands, redact sandbox outputs before storage, and derive model prompts from a redacted diff representation.","api_surface":"Example CLI/report behavior and stored artifact schema; no core package API change.","approach":"The PR builds a larger code-review example with sandbox checks, SQLite/report persistence, and optional model review.","attention_points":["examples/skills_code_review_agent/internal/sandbox/runner.go:185 synthetic denied commands inflate permission counts","examples/skills_code_review_agent/internal/pipeline/pipeline.go:213 sandbox output is persisted without redaction","examples/skills_code_review_agent/internal/llmreview/review.go:155 LLM prompt uses unredacted raw diff"],"author":"xiaocaidie313","behavior_impact":"Clean runs can look blocked by fake denials, and real LLM mode can receive content that the report layer would otherwise redact.","change_inventory":"Adds sandbox command planning, permission accounting, durable review artifacts, and model review support.","ci_state":"Current effective checks refreshed: 162 checks, non-green=0.","cross_module_impact":"The example is likely to be copied into future skills or CI flows, so unsafe defaults can propagate.","design_assessment":"The feature set is ambitious, yet the current persistence and prompt boundaries are too permissive.","evidence_checked":"Current PR head 33135233b0e4064ce977f375ba2345a328b29ad2, changed files, refreshed checks where available, existing review comments, and the current diff for every posted line.","head_sha":"33135233b0e4064ce977f375ba2345a328b29ad2","implementation_derivation":"The risky paths are the command-planning, report-storage, and model-prompt seams where untrusted repository content crosses into durable artifacts or external calls.","inline_comments":[{"body":"`buildPlannedCommands` records synthetic high-risk commands on every run, so clean reviews persist fake denials and inflate `permission_deny_count`. Build permission records only from commands the pipeline actually intends to run, and cover real denied commands with a targeted test.\n\n<details><summary>中文<\/summary>\n`buildPlannedCommands` 每次运行都会记录虚构的高风险命令，导致干净审查也会落库假的 deny，并抬高 `permission_deny_count`。请只为流水线真实计划执行的命令记录权限决策，并用真实被拒命令补一个针对性测试。\n<\/details>","focus":"synthetic denied commands inflate permission counts","line":185,"path":"examples/skills_code_review_agent/internal/sandbox/runner.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3594298249"},{"body":"Sandbox stdout/stderr are persisted without redaction, so a test or check that prints a token can leak it into both reports and SQLite artifacts. Redact these fields before building report/storage summaries, or omit raw sandbox output from persisted artifacts.\n\n<details><summary>中文<\/summary>\nsandbox 的 stdout/stderr 会未脱敏地写入报告和 SQLite artifact，所以测试或检查脚本一旦打印 token，就会绕过报告与数据库的脱敏承诺。请在构造报告/存储摘要前脱敏这些字段，或不要持久化原始 sandbox 输出。\n<\/details>","focus":"sandbox output is persisted without redaction","line":213,"path":"examples/skills_code_review_agent/internal/pipeline/pipeline.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3594298841"},{"body":"Real LLM mode sends `opts.DiffRaw` to the model before redaction, so a diff containing a new API key or password is transmitted externally. Redact secret values before building the prompt, or require an explicit opt-in for unredacted external LLM review.\n\n<details><summary>中文<\/summary>\n真实 LLM 模式会在脱敏前把 `opts.DiffRaw` 发给模型，因此包含新 API key 或 password 的 diff 会被外发。请在构造 prompt 前脱敏敏感值，或要求用户显式选择允许未脱敏内容进入外部 LLM 审查。\n<\/details>","focus":"LLM prompt uses unredacted raw diff","line":155,"path":"examples/skills_code_review_agent/internal/llmreview/review.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222#discussion_r3594299387"}],"issue_evidence_gaps":"The review did not execute arbitrary sandbox commands; the findings are static checks against the current persistence and prompt-building paths.","merge_policy":"blocked_by_review_findings","module_impact":"Operators may misread permission-deny metrics, and artifacts may retain sensitive data emitted by checks.","modules":"examples/skills_code_review_agent sandbox runner, pipeline persistence, and LLM review package","necessity_assessment":"important_but_needs_safety_fixes: the example addresses a real workflow, but redaction and accounting defects must be fixed first.","number":2222,"outcome":"3 inline comments posted on the current head.","problem":"The pipeline records synthetic permission denials, persists raw sandbox output, and sends the unredacted diff to real model review.","problem_framing":"A review tool cannot claim safe artifacts if counters include fake events or if raw command/model inputs can leak secrets into reports and storage.","reproduction_on_base":"Full runtime reproduction was not executed locally; the finding is grounded in current code paths and documented contracts.","review_action":"Posted 3 inline GitHub comments; no approval, request-changes review, LGTM label, or merge was submitted.","risk":"Maintainers should keep the PR unmerged until the posted findings are addressed and checks are clean.","root_cause":"Permission planning is seeded with placeholder high-risk commands, while redaction is applied after sandbox and model input boundaries instead of before persistence and prompt construction.","semantic_changes":"Reports can currently contain artificial deny counts and raw unredacted command output or diff content.","solution_fit_assessment":"The architecture can work, but safety-sensitive boundaries need to be corrected before the example is broadly usable.","status":"commented","technical_background":"The code-review-agent example runs untrusted or semi-trusted repository checks, stores diagnostics, and can optionally call a model; permission accounting and redaction are therefore part of its safety boundary.","tests_docs":"Needs tests for real denied commands, sandbox-output redaction, and redacted model prompt construction.","title":"tes:Feat cr agent","tradeoffs":"Stricter redaction can reduce diagnostic detail, but it keeps artifacts and external calls aligned with the tool safety promise.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2222"},{"alternative_designs":"Key by app/user/session plus cookie scope, or place the initialization guard in the session service layer where persisted state can be re-read atomically.","api_surface":"Internal A2A agent behavior; public user-facing conversation continuity is affected.","approach":"The PR decouples anonymous A2A principals from context IDs and adds session-scoped cookie handling plus initialization locking.","attention_points":["agent/a2aagent/a2a_agent.go:279 anonymous cookie initialization lock uses clone pointer identity"],"author":"XnLemon","behavior_impact":"Users can observe inconsistent remote A2A memory or context after concurrent initial calls.","change_inventory":"Updates anonymous cookie capture, storage, and initialization locking around A2A client creation.","ci_state":"Current effective checks refreshed: 164 checks, non-green=0.","cross_module_impact":"Runner and session-service callers that clone sessions can bypass the intended per-session lock.","design_assessment":"The design addresses the right problem but still has a first-call concurrency hole.","evidence_checked":"Current PR head 392af7530e8b7869281771228734fe379ffb361a, changed files, refreshed checks where available, existing review comments, and the current diff for every posted line.","head_sha":"392af7530e8b7869281771228734fe379ffb361a","implementation_derivation":"The race sits in the lock key for the exact critical section that should serialize first-cookie acquisition.","inline_comments":[{"body":"Concurrent first anonymous calls for the same persisted session can still bypass this lock because the scope key uses the cloned `*session.Session` pointer. Key initialization by the logical persistent session identity plus cookie state key, and reload/share the persisted cookie inside the lock so parallel `runner.Run` calls converge on one remote principal.\n\n<details><summary>中文<\/summary>\n同一个持久化 session 的首次匿名并发调用仍可能绕过这把锁，因为 scope key 使用的是克隆后的 `*session.Session` 指针。请改为用逻辑持久化 session 身份加 cookie state key 作为锁键，并在锁内重新读取/共享持久化 cookie，确保并发的 `runner.Run` 收敛到同一个远端 principal。\n<\/details>","focus":"anonymous cookie initialization lock uses clone pointer identity","line":279,"path":"agent/a2aagent/a2a_agent.go","severity":"high","url":"https://github.com/trpc-group/trpc-agent-go/pull/2163#discussion_r3594339797"}],"issue_evidence_gaps":"The review did not spin up a remote A2A service; the issue is derived from session clone identity and the locking map key.","merge_policy":"blocked_by_review_findings","module_impact":"A single local session may split into multiple remote anonymous identities under concurrency.","modules":"agent/a2aagent anonymous client and session cookie state handling","necessity_assessment":"necessary_principal_isolation_fix_with_remaining_race: decoupling principals is needed, but the current lock scope is not durable enough.","number":2163,"outcome":"1 inline comment posted on the current head.","problem":"The new initialization lock is keyed by the cloned session pointer, so parallel first calls for the same persisted session can still acquire separate anonymous cookies.","problem_framing":"The fix must protect the logical persisted session identity, not just one in-memory clone produced by a single runner call.","reproduction_on_base":"Full runtime reproduction was not executed locally; the finding is grounded in current code paths and documented contracts.","review_action":"Posted 1 inline GitHub comment; no approval, request-changes review, LGTM label, or merge was submitted.","risk":"Maintainers should keep the PR unmerged until the posted findings are addressed and checks are clean.","root_cause":"Normal runner/session-service flows may load separate `*session.Session` instances for the same logical session, and pointer identity does not collapse those clones into one lock scope.","semantic_changes":"Parallel first runs for the same persisted session can still create different remote principals.","solution_fit_assessment":"The direction is correct, but the lock key must use durable session identity and reload or share the cookie inside the lock.","status":"commented","technical_background":"The A2A anonymous principal flow stores a remote cookie-backed identity per local session so separate runner calls can continue the same remote conversation without exposing cookies through public event deltas.","tests_docs":"Needs a regression with two separate runner calls loading the same persisted session concurrently.","title":"server/a2a: decouple anonymous principals from A2A context IDs","tradeoffs":"A durable key can serialize more calls than pointer identity, but it is the necessary scope for principal consistency.","url":"https://github.com/trpc-group/trpc-agent-go/pull/2163"}],"follow_up":[{"reason":"55 个 PR 已复核但仍需 maintainer 明确确认后再进入 LGTM 或合入流程。","title":"人工确认队列"},{"reason":"自有 PR 本轮不自审不自合；#2234 当前有 codecov/patch 软门禁，未记录 CONFLICTING 状态。","title":"自有 PR 状态"},{"reason":"0 个 PR 已有可执行反馈，等待作者更新或 maintainer 判断后再复核。","title":"已有反馈复查"}],"generated_at":"2026-07-16T17:19:44+08:00","maintained":[],"overview":"本次完成 MyCR 仓库同步和 trpc-agent-go open PR 全量台账刷新：当前 open PR 共 97 个，较上一份报告增加 2 个净增量；新进入台账 6 个，移出 4 个。深入复核覆盖 33 个需要重新判断的 PR，沿用 64 个未变化 PR 的上一轮结论；最终在 #2243、#2238、#2225、#2222、#2163 上提交 11 条 inline comments，没有提交 approval、request-changes review、LGTM 或 merge。当前 4 个 required checks 未通过，17 个 Draft/WIP 暂缓，12 个自有 PR 只做状态和冲突检查，0 个已有反馈等待处理，55 个已复核待人工确认。自有 PR 未发现 CONFLICTING 状态，需要继续关注 #2234 的 codecov/patch 软门禁。","repo":"trpc-group/trpc-agent-go","repo_info":{"added_prs":[2244,2243,2242,2241,2240,2238],"approved":0,"blocked":0,"carry_forward":64,"commented":5,"heavy_reviewed":33,"maintained":0,"open_prs":97,"removed_prs":[2236,2214,2213,2109],"repo":"trpc-group/trpc-agent-go","skipped":92},"skill_evolution":[{"area":"状态刷   return text(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function linkifyPrReferences(html) {
  const repo = text(reportData.repo || "trpc-group/trpc-agent-go");
  if (!repo) return html;
  return html.replace(
    /(^|[^\w/])#(\d{3,6})\b/g,
    (match, prefix, number) =>
      `${prefix}<a href="https://github.com/${repo}/pull/${number}">#${number}</a>`
  );
}

function linkifyUrls(html) {
  return html.replace(
    /(https?:\/\/[^\s<>"']+)/g,
    (match) => {
      const trailing = (match.match(/[.,;)]+$/u) || [""])[0];
      const href = trailing ? match.slice(0, -trailing.length) : match;
      return `<a href="${href}">${href}</a>${trailing}`;
    }
  );
}

function formatRich(value) {
  let html = linkifyPrReferences(linkifyUrls(escapeHtml(value)));
  const replacements = [
    [
      /(P[0-2]|codecov\/patch=FAILURE|go-apidiff=FAILURE|go-apidiff|FAILURE|失败|阻塞|不能合入|不能 merge|未合并|破坏性|breaking|unbounded|无界|绕过|丢失|重复|不稳定|风险)/gi,
      "mark-bad"
    ],
    [
      /(LGTM|已合并|已批准|squash merge|merged|approved|CI 全绿|全绿|修复有效|\bresolved\b|\bresolve\b)/gi,
      "mark-good"
    ],
    [
      /(pending|soft[- ]?CI|软门禁|follow-up|后续|关注|CodeRabbit|review readiness|not[_ -]?reached)/gi,
      "mark-info"
    ],
    [
      /(导出 API|\bAPI\b|兼容性|\bsession\b|\brunner\b|\bmemory\b|GraphRAG|workspace_exec|OpenAPI|\bpolicy\b|security|安全)/gi,
      "mark-warn"
    ]
  ];
  for (const [pattern, className] of replacements) {
    html = html.replace(pattern, `<mark class="${className}">$1</mark>`);
  }
  return html;
}

function prs() {
  const skippedByNumber = new Map();
  for (const group of skippedGroups()) {
    for (const item of (group.items || [])) {
      const key = item.number ? String(item.number) : `${group.reason || "skipped"}:${text(item.title)}`;
      if (skippedByNumber.has(key)) continue;
      skippedByNumber.set(key, {
      ...item,
      status: item.status || "skipped",
      skip_reason: item.skip_reason || group.reason
      });
    }
  }
  const skipped = [...skippedByNumber.values()];
  return [
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || []),
    ...skipped
  ];
}

function skippedGroups() {
  const processedNumbers = new Set([
    ...(reportData.approved || []),
    ...(reportData.commented || []),
    ...(reportData.maintained || []),
    ...(reportData.blocked || [])
  ].map(item => Number(item.number)).filter(Boolean));
  return (reportData.skipped_groups || []).map(group => {
    const existingItems = group.items || [];
    if (existingItems.length) {
      return {
        ...group,
        items: existingItems.filter(item => !processedNumbers.has(Number(item.number)))
      };
    }
    const items = (group.prs || []).filter(number => !processedNumbers.has(Number(number))).map(number => {
      const reason = group.reason || "skipped";
      const summary = text(group.title_zh || group.title || reason);
      return {
        number,
        title: `PR #${number}`,
        url: "",
        author: "",
        status: "skipped",
        skip_reason: summary,
        readiness_audit: summary,
        ci_state: "",
        blockers: [{
          kind: reason,
          summary
        }]
      };
    });
    return { ...group, items, count: items.length };
  }).filter(group => group.items.length > 0);
}

function counts(items) {
  const result = Object.fromEntries(statusOrder.map(status => [status, 0]));
  for (const item of items) {
    const status = item.status || "skipped";
    result[status] = (result[status] || 0) + 1;
  }
  return result;
}

function matchesSearch(item, query) {

    text(item.evidence_checked),

  ].join(" ").toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function blockersSearchText(blockers) {

    return [
      blocker.kind,
      blocker.summary,
      blocker.reviewer,
      blocker.path,
      blocker.line,
      blocker.latest_response,
      blocker.verification,
      blocker.url
    ].map(value => text(value)).join(" ");
  }).join(" ");
}

function renderBlockers(item) {
  const blockers = Array.isArray(item.blockers) ? item.blockers : [];
  if (!blockers.length) return "";
  const isNonBlockerList = blockers.every(blocker => {
    const kind = typeof blocker === "object" && blocker !== null ? String(blocker.kind || "") : "";
    return kind === ("not" + "_reached") || kind === "状态刷新";
  });
  const detailLabel = isNonBlockerList
    ? labels[lang].nonBlockerDetails
    : labels[lang].blockerDetails;
  const rendered = blockers.map(blocker => {
    const data = typeof blocker === "object" && blocker !== null
      ? blocker
      : { summary: blocker };
    const location = [data.path, data.line ? `:${data.line}` : ""].filter(Boolean).join("");
    const meta = [
      data.kind ? blockerKindLabel(data.kind) : "",
      data.reviewer ? `reviewer: ${text(data.reviewer)}` : "",
      location,
      data.latest_response ? `latest: ${text(data.latest_response)}` : "",

    ].filter(Boolean).join(" · ");
    const summary = formatRich(data.summary || blocker);

    return `<li class="blocker-item"><div>${summary}${link}</div>${meta ? `<div class="blocker-meta">${escapeHtml(meta)}</div>` : ""}</li>`;
  }).join("");
  return `<div class="skip-detail"><strong>${detailLabel}:</strong></div><ul class="blocker-list">${rendered}</ul>`;
}

function blockerKindLabel(kind) {
  return (labels[lang].blockerKinds || {})[kind] || text(kind);
}

  function inlineCommentText(comment) {
    if (comment === undefined || comment === null) return "";
    if (typeof comment !== "object" || Array.isArray(comment)) {
      return text(comment);
    }
    if (lang === "zh") {
      return text(comment.summary_zh || comment.summary || comment.body || comment.message || "");

  }

function allPrText(item) {
  const comments = (item.inline_comments || []).map(comment => [
    comment.severity,

  ].map(value => text(value)).join(" ")).join(" ");

function readingAdvice(item) {
  const status = item.status || "skipped";
  const comments = item.inline_comments || [];
  const blockers = item.blockers || [];
  const body = allPrText(item);
  const hasP1 = comments.some(comment =>
    /\bP[01]\b/i.test(text(comment.severity)) ||
    /\bP[01]\b/i.test(inlineCommentText(comment))
  );
  const hasCriticalRisk = hasP1 ||
    /(security|安全|bypass|绕过|breaking|破坏性|unbounded|无界|丢失|重复|不稳定|兼容|api|go-apidiff|failure|失败|不能 merge|不能合入|race|并发)/i.test(body);
  const highImpactFeature =
    /(add|new|新增|support|支持|agent|runner|session|memory|graphrag|knowledge|openapi|workspace_exec|policy|extension|tool|graph|api)/i.test(body);

  const copy = {
    critical: {
      icon: "🔥",
      zh: "重点精读",
      en: "Deep Read",
      reasonZh: comments.length
        ? `有 ${comments.length} 条行级评论，且包含 P1/兼容/正确性/安全类风险。`
        : "包含高风险兼容性或正确性信号，需要重点复核。",
      reasonEn: comments.length
        ? `${comments.length} inline comment(s), including P1, compatibility, correctness, or security risk.`
        : "High-risk compatibility or correctness signal; review carefully."
    },
    focus: {
      icon: "🔎",
      zh: "建议细看",
      en: "Read Carefully",
      reasonZh: comments.length
        ? `有 ${comments.length} 条评论或重要设计取舍，建议看完整结论。`
        : "涉及核心模块、导出 API 或较大功能，建议细看。",
      reasonEn: comments.length
        ? `${comments.length} comment(s) or important design tradeoffs; read the full conclusion.`
        : "Core module, exported API, or larger feature; read carefully."
    },
    skim: {
      icon: "✅",
      zh: "快速略看",
      en: "Quick Skim",
      reasonZh: "风险低或改动较直接，扫结论和 CI 状态即可。",
      reasonEn: "Low risk or straightforward change; skim outcome and CI state."
    },
    follow: {
      icon: "⏳",
      zh: "只看阻塞",
      en: "Blocker Only",
      reasonZh: blockers.length
        ? `主要看 ${blockers.length} 个具体阻塞点，暂不需要读完整实现。`
        : "当前不是可合并状态，先看阻塞和后续动作。",
      reasonEn: blockers.length
        ? `Focus on ${blockers.length} concrete blocker(s); no need to read the full implementation yet.`
        : "Not merge-ready; focus on blockers and next action."
    }
  };

  let level = "skim";
  if (status === "blocked") {
    level = "follow";
  } else if (status === "commented") {
    level = hasCriticalRisk ? "critical" : "focus";
  } else if (status === "maintained") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "approved") {
    level = hasCriticalRisk || highImpactFeature ? "focus" : "skim";
  } else if (status === "merged") {
    level = highImpactFeature || hasCriticalRisk ? "focus" : "skim";
  } else if (status === "skipped") {
    level = blockers.length || /(conflict|ci|failure|失败|未回应|review)/i.test(body)
      ? "follow"
      : "skim";
  }

  const selected = copy[level];
  return {
    level,
    icon: selected.icon,
    label: lang === "zh" ? selected.zh : selected.en,
    reason: lang === "zh" ? selected.reasonZh : selected.reasonEn
  };
}

function priorityRank(level) {
  return { critical: 4, focus: 3, follow: 2, skim: 1 }[level] || 0;
}

function renderReadingGuide(items) {
  const panel = document.getElementById("readingGuidePanel");
  const container = document.getElementById("readingGuide");
  const candidates = [
    ...items.filter(item => (item.status || "skipped") !== "skipped"),
    ...(reportData.follow_up || []).map(item => {
      if (typeof item === "object" && item !== null && !Array.isArray(item)) {
        return { ...item, status: item.status || "blocked" };
      }
      const body = text(item);
      return { title: body, next: body, status: "blocked", plain: true };
    })
  ].map(item => ({ item, advice: readingAdvice(item) }))
    .filter(entry => entry.advice.level !== "skim")
    .sort((left, right) => priorityRank(right.advice.level) - priorityRank(left.advice.level));

  if (!candidates.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }

  panel.style.display = "block";
  container.innerHTML = candidates.slice(0, 9).map(entry => {
    const item = entry.item;
    const advice = entry.advice;
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText} · ${escapeHtml(text(item.title))}</a>`
      : `<span>${prText} · ${escapeHtml(text(item.title))}</span>`;
    return `
      <article class="guide-card ${advice.level}">
        <div class="guide-meta">
          <span class="read-pill ${advice.level}">${advice.icon} ${escapeHtml(advice.label)}</span>
          <span class="badge ${item.status || "skipped"}">${labels[lang][item.status] || item.status || labels[lang].skipped}</span>
        </div>
        <div>${prLink}</div>
        <div class="guide-reason">${escapeHtml(advice.reason)}</div>
      </article>
    `;
  }).join("");
}

      storyLine(labels[lang].issueEvidenceGaps, item.issue_evidence_gaps),
      storyLine(labels[lang].problemFraming, item.problem_framing),
      storyLine(labels[lang].rootCause, item.root_cause)
    ], "hero-block"),
    storyBlock(labels[lang].solutionAndTradeoffs, [
      storyLine(labels[lang].approach, item.approach),
      storyLine(labels[lang].implementationDerivation, item.implementation_derivation),
      storyLine(labels[lang].solutionFitAssessment, item.solution_fit_assessment),
      storyLine(labels[lang].alternativeDesigns, item.alternative_designs),
      storyLine(labels[lang].tradeoffs, item.tradeoffs),
      storyLine(labels[lang].designAssessment, item.design_assessment)
    ]),
    storyBlock(labels[lang].impactAndEvidence, [
      storyLine(labels[lang].changeInventory, item.change_inventory),
      storyLine(labels[lang].semanticChanges, item.semantic_changes),
      storyLine(labels[lang].behaviorImpact, item.behavior_impact),
      storyLine(labels[lang].moduleImpact, item.module_impact),
      storyLine(labels[lang].crossModuleImpact, item.cross_module_impact)
    ]),
    renderComments(item)
  ].filter(Boolean).join("");
  return `<div class="pr-readout"><div class="pr-story">${story}</div>${renderReviewRail(item)}</div>`;
}

function renderCards() {
  const query = document.getElementById("search").value.trim();
  const visible = prs().filter(item => (item.status || "skipped") !== "skipped")
    .filter(item => {
    const status = item.status || "skipped";
    return (filter === "all" || status === filter) && matchesSearch(item, query);
  });
  const container = document.getElementById("cards");
  if (!visible.length) {
    container.innerHTML = `<div class="empty">${labels[lang].empty}</div>`;
    return;
  }
  container.innerHTML = visible.map(item => {
    const status = item.status || "skipped";
    const advice = readingAdvice(item);
    const summary = compactSummary(item);
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
      : prText;
    return `
      <article class="card priority-${advice.level}" data-status="${status}">
        <div class="card-head">
          <div>
            <div class="headline-row">
              <h3 class="card-title">${prLink} · ${escapeHtml(text(item.title))}</h3>
              <span class="read-pill ${advice.level}">${advice.icon} ${escapeHtml(advice.label)}</span>
            </div>
            <div class="meta">
              <span>${labels[lang].author}: ${escapeHtml(item.author || "")}</span>
              <span class="advice-reason">${escapeHtml(advice.reason)}</span>
            </div>
            <div class="card-summary">${formatRich(summary)}</div>
          </div>
          <div class="card-actions">
            <span class="badge ${status}">${labels[lang][status] || status}</span>
            <button class="card-toggle" type="button" aria-expanded="false">${labels[lang].expandDetails}</button>
          </div>
        </div>
        <div class="card-body">
          ${renderPrReadout(item)}
        </div>
      </article>
    `;
  }).join("");
  document.querySelectorAll(".card-head").forEach(head => {
    head.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      const card = head.closest(".card");
      setCardOpen(card, !card.classList.contains("open"));
    });
  });
  document.querySelectorAll(".card").forEach(card => updateCardToggle(card));
}

function renderSkipGroups() {
  const heading = document.getElementById("skippedHeading");
  const container = document.getElementById("skipGroups");
  if (!["all", "skipped"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  const query = document.getElementById("search").value.trim();
  const groups = skippedGroups().map(group => {
    const reason = group.reason || "";
    const title = lang === "zh"
      ? text(group.title_zh || group.label || group.title || group.reason)
      : text(group.title_en || group.label_en || group.label || group.title || group.reason);
    const items = (group.items || []).map(item => ({
      ...item,
      status: item.status || "skipped",
      group_reason: reason,
      skip_reason: item.skip_reason || reason
    })).filter(item => matchesSearch(item, query));
    return { reason, title, items };
  }).filter(group => group.items.length > 0);
  if (!groups.length) {
    container.innerHTML = `<div class="empty">${labels[lang].empty}</div>`;
    return;
  }
  container.innerHTML = groups.map((group, index) => `
    <article class="skip-group open">
      <div class="skip-group-head" data-skip-group="${index}">
        <h3 class="skip-group-title">${escapeHtml(text(group.title || group.reason))}</h3>
        <span class="skip-group-count">${group.items.length} ${labels[lang].items}</span>
      </div>
      <div class="skip-group-body">
        ${group.items.map(item => {
          const prText = item.number ? `#${item.number}` : "PR";
          const prLink = item.url
            ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
            : prText;
          return `
            <div class="skip-row">
              <div>
                <div class="skip-title">${prLink} · ${escapeHtml(text(item.title))}</div>
                <div class="skip-detail">${labels[lang].author}: ${escapeHtml(item.author || "")}</div>
              </div>
              <div>
                <div><strong>${labels[lang].reason}:</strong> ${formatRich(text(item.skip_reason))}</div>
                ${item.readiness_audit ? `<div class="skip-detail"><strong>${labels[lang].readinessAudit}:</strong> ${formatRich(text(item.readiness_audit))}</div>` : ""}
                ${item.necessity_assessment ? `<div class="skip-detail"><strong>${labels[lang].necessityAssessment}:</strong> ${formatRich(text(item.necessity_assessment))}</div>` : ""}
                ${item.evidence_checked ? `<div class="skip-detail"><strong>${labels[lang].evidenceChecked}:</strong> ${formatRich(text(item.evidence_checked))}</div>` : ""}
                ${item.reproduction_on_base ? `<div class="skip-detail"><strong>${labels[lang].reproductionOnBase}:</strong> ${formatRich(text(item.reproduction_on_base))}</div>` : ""}
                ${item.issue_evidence_gaps ? `<div class="skip-detail"><strong>${labels[lang].issueEvidenceGaps}:</strong> ${formatRich(text(item.issue_evidence_gaps))}</div>` : ""}
                ${item.implementation_derivation ? `<div class="skip-detail"><strong>${labels[lang].implementationDerivation}:</strong> ${formatRich(text(item.implementation_derivation))}</div>` : ""}
                ${item.solution_fit_assessment ? `<div class="skip-detail"><strong>${labels[lang].solutionFitAssessment}:</strong> ${formatRich(text(item.solution_fit_assessment))}</div>` : ""}
                ${renderBlockers(item)}
                ${item.ci_state ? `<div class="skip-detail">${formatRich(text(item.ci_state))}</div>` : ""}
                ${item.risk ? `<div class="skip-detail">${formatRich(text(item.risk))}</div>` : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </article>
  `).join("");
  document.querySelectorAll("[data-skip-group]").forEach(head => {
    head.addEventListener("click", () => {
      head.closest(".skip-group").classList.toggle("open");
    });
  });
}

function renderFollowUp() {
  const heading = document.getElementById("followUpHeading");
  const container = document.getElementById("followUpCards");
  if (!["all", "skipped", "blocked"].includes(filter)) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  const query = document.getElementById("search").value.trim().toLowerCase();
  const items = (reportData.follow_up || []).map(item => {
    if (typeof item === "object" && item !== null && !Array.isArray(item)) return item;
    const body = text(item);
    return {
      title: body,
      next: body,
      plain: true
    };
  }).filter(item => {
    if (!query) return true;
    return [
      item.number,
      item.author,
      text(item.title),
      text(item.reason),
      text(item.next)
    ].join(" ").toLowerCase().includes(query);
  });
  if (!items.length) {
    heading.style.display = "none";
    container.style.display = "none";
    return;
  }
  heading.style.display = "flex";
  container.style.display = "grid";
  container.innerHTML = items.map(item => {
    const hasPrIdentity = Boolean(item.number || item.url);
    const prText = item.number ? `#${item.number}` : "PR";
    const prLink = item.url
      ? `<a href="${escapeHtml(item.url)}">${prText}</a>`
      : prText;
    const title = formatRich(text(item.title || item.next || item.reason));
    const cardTitle = hasPrIdentity ? `${prLink} · ${title}` : title;
    const meta = item.author
      ? `<div class="meta">${labels[lang].author}: ${escapeHtml(item.author)}</div>`
      : "";
    const body = item.plain
      ? `<div>${formatRich(text(item.next || item.title))}</div>`
      : `<div class="grid">
          ${field(labels[lang].reason, item.reason)}
          ${field(labels[lang].outcome, item.next)}
        </div>`;
    return `
      <article class="card open" data-status="blocked">
        <div class="card-head">
          <div>
            <h3 class="card-title">${cardTitle}</h3>
            ${meta}
          </div>
          <span class="badge blocked">${labels[lang].followups}</span>
        </div>
        <div class="card-body">
          ${body}
        </div>
      </article>
    `;
  }).join("");
}

function renderEvolution() {
  const panel = document.getElementById("evolutionPanel");
  const container = document.getElementById("evolutionList");
  const items = reportData.skill_evolution || [];
  if (!items.length) {
    panel.style.display = "none";
    container.innerHTML = "";
    return;
  }
  panel.style.display = "block";
  container.innerHTML = items.map(item => {
    const data = typeof item === "object" && item !== null && !Array.isArray(item)
      ? item
      : { area: labels[lang].selfEvolutionSection, note: item };
    return `
      <article class="evolution-item">
        <div class="evolution-area">${escapeHtml(text(data.area || labels[lang].selfEvolutionSection))}</div>
        <div class="evolution-note">${formatRich(text(data.note || data.summary || data.body || ""))}</div>
      </article>
    `;
  }).join("");
}

function render() {
  const items = prs();
  renderStatic();
  renderMetrics(items);
  renderBars(items);
  renderTimeline();
  renderOverview();
  renderReadingGuide(items);
  renderChips();
  renderCards();
  renderSkipGroups();
  renderFollowUp();
  renderEvolution();
}

document.querySelectorAll("[data-lang-button]").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.langButton));
});
document.getElementById("search").addEventListener("input", () => {
  renderCards();
  renderSkipGroups();
  renderFollowUp();
});
document.getElementById("openAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, true));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.add("open"));
});
document.getElementById("closeAll").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(card => setCardOpen(card, false));
  document.querySelectorAll(".skip-group").forEach(node => node.classList.remove("open"));
});
render();
</script>
</body>
</html>
